<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="api-base" content="">
<title>SINTA PADI — Kabupaten Kebumen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230f172a'/%3E%3Crect x='3' y='3' width='10' height='10' fill='%23047857'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--navy:#0f172a;--green:#047857;--green-ink:#065f46;--bg:#f3f6f4;--line:#e2e8f0;--ink:#0f172a;--muted:#64748b;--paper:#fff;--amber:#b45309;--red:#b91c1c}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{color-scheme:light}
html.dark{color-scheme:dark}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.skip{position:absolute;left:-999px;top:8px;background:#fff;color:#0f172a;padding:8px 12px;z-index:90}
.skip:focus{left:8px}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.sb{position:fixed;z-index:50;top:0;bottom:0;left:0;width:232px;background:var(--navy);color:#e2e8f0;display:flex;flex-direction:column}
.brand{padding:16px 16px 10px}
.brand b{display:block;font-size:16px;letter-spacing:.04em}
.brand small{display:block;color:#94a3b8;font-size:12px;margin-top:2px}
.sb nav{flex:1;overflow:auto;padding:6px 0 12px}
.sb .grp{margin:12px 16px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#64748b}
.sb a{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;color:#cbd5e1;text-decoration:none;font-size:14px;font-weight:600;border-left:3px solid transparent}
.sb a:hover{color:#fff;background:rgba(255,255,255,.05)}
.sb a.on{color:#fff;background:#123024;border-left-color:#34d399}
.sb .foot{border-top:1px solid rgba(255,255,255,.08);padding:12px 14px;font-size:12px;color:#94a3b8}
.sb .foot b{color:#e2e8f0;font-size:13px}
.hdr{position:fixed;z-index:40;top:0;left:232px;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.hdr .who{font-size:13px;color:var(--muted)}
.hdr .who b{color:var(--ink);font-weight:700}
.hdr .tools{display:flex;align-items:center;gap:8px}
.main{margin-left:232px;margin-top:56px;padding:16px 16px 40px}
.backdrop{position:fixed;inset:0;z-index:45;border:0;background:rgba(15,23,42,.45)}
h1{font-size:22px;line-height:1.2;margin:0 0 4px;font-weight:700}
h2{font-size:16px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 14px}
.rowline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.filters label,.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.inp,select.inp,textarea.inp{min-height:44px;border:1px solid #cbd5e1;border-radius:6px;padding:8px 10px;background:#fff;width:100%}
textarea.inp{min-height:96px;resize:vertical}
.btn{min-height:44px;padding:0 14px;border-radius:6px;border:1px solid transparent;background:var(--green);color:#fff;font-weight:700;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border-color:#cbd5e1}
.btn.warn{background:var(--red)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.iconbtn{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #cbd5e1;background:#fff;border-radius:6px;color:inherit;cursor:pointer}
.ico{width:18px;height:18px;display:block}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;white-space:nowrap}
.st i{width:8px;height:8px;background:currentColor;display:block}
.st-belum{color:#475569}
.st-draf{color:var(--amber)}
.st-sudah{color:var(--green-ink)}
.st-ditolak{color:var(--red)}
.prog{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;font-size:14px}
.hit{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:52px;padding:8px 10px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer;color:inherit;text-decoration:none}
.hit:hover{background:#f8fafc}
.hit .grow{flex:1;min-width:0}
.hit small{display:block;color:var(--muted);font-size:12px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:#f8fafc;position:sticky;top:0}
.tbl a{color:var(--green-ink);font-weight:700}
.scroller{overflow:auto;max-height:70vh}
.kv{display:grid;grid-template-columns:minmax(120px,180px) 1fr;gap:6px 12px;margin:0}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0}
.fld .fielderr,.fielderr{color:var(--red);font-size:13px;font-weight:700;margin:4px 0 0}
.err{background:#fef2f2;color:#7f1d1d;border:1px solid #fecaca;border-radius:6px;padding:10px 12px;margin:0 0 12px}
.err p{margin:0}
.err .retry{margin-top:6px;font-weight:700}
.stale{background:#fffbeb;color:#78350f;border:1px solid #fde68a;border-radius:6px;padding:8px 10px;margin:0 0 12px;font-size:13px}
.lock{background:#f8fafc;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:0 0 12px}
.reject{background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:10px 12px;margin:0 0 12px}
.reject b{display:block;color:var(--red);margin-bottom:4px}
.note{margin:6px 0 0;font-size:14px}
.slot{padding:12px 0;border-top:1px solid var(--line)}
.slot .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.slot img{display:block;width:160px;max-width:100%;height:120px;object-fit:cover;background:#f1f5f9;margin:8px 0}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filebtn{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;font-weight:700;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.meter{height:8px;background:#e2e8f0;margin-top:8px}
.meter i{display:block;height:100%;width:0;background:var(--green)}
.hint{color:var(--muted);font-size:12px;margin:4px 0 0}
.modal{position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .panel{width:min(440px,100%);margin:0}
.boot{padding:24px}
.mob{display:none}
.pager{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.pager span{white-space:nowrap}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.tabs button{min-height:44px;padding:0 12px;border:1px solid #cbd5e1;background:#fff;border-radius:6px;cursor:pointer;font-weight:600}
.tabs button.on{background:#123024;color:#fff;border-color:#123024}
html.dark body{background:#020617;color:#e2e8f0}
html.dark .hdr,html.dark .panel,html.dark .inp,html.dark select.inp,html.dark textarea.inp,html.dark .btn.ghost,html.dark .iconbtn,html.dark .filebtn,html.dark .tabs button{background:#0f172a;color:#e2e8f0;border-color:#334155}
html.dark .tbl th{background:#1e293b;color:#94a3b8}
html.dark .tbl td,html.dark .tbl th{border-color:#1e293b}
.sb .btn.ghost{background:#fff;color:#0f172a}
html.dark .hit:hover{background:#1e293b}
html.dark .sub,html.dark .hint,html.dark .hdr .who,html.dark .kv dt,html.dark .filters label,html.dark .fld{color:#94a3b8}
html.dark .hdr .who b{color:#e2e8f0}
html.dark .stale{background:#3f2d12;color:#fde68a;border-color:#854d0e}
html.dark .err,html.dark .reject{background:#450a0a;color:#fecaca;border-color:#7f1d1d}
html.dark .lock{background:#0f172a;border-color:#334155}
html.dark .st-belum{color:#cbd5e1}
html.dark .st-draf{color:#fbbf24}
html.dark .st-sudah{color:#34d399}
html.dark .st-ditolak{color:#fca5a5}
html.dark .tbl a{color:#6ee7b7}
html.dark .meter{background:#1e293b}
html.dark .slot img{background:#1e293b}
@media(max-width:800px){
  .mob{display:inline-flex}
  .sb{transform:translateX(-105%);width:min(280px,88vw)}
  .sb.open{transform:none}
  .hdr,.main{left:0;margin-left:0}
  .main{padding:12px 12px 32px}
  .kv{grid-template-columns:1fr}
}
@media print{.sb,.hdr,.btn,.iconbtn,.filters{display:none!important}.main{margin:0}}
</style>
</head>
<body>
<a class="skip" href="#isi">Lewati ke isi</a>
<noscript><p style="padding:24px;font-family:sans-serif">SINTA PADI membutuhkan JavaScript.</p></noscript>
<div id="app"></div>
<script>
const S = {
  token: '',
  user: null,
  me: null,
  dark: localStorage.getItem('sp_dark') === '1',
  navOpen: false,
  listUi: { jenis: '', status: '', mitra: '', q: '', page: 0 },
  drill: { jenis: '', status: '', q: '', page: 0 },
  cache: null,
  akun: null,
  opsi: null,
  dash: null,
  listMeta: null,
  detailKey: '',
  detailDoc: null,
  form: null,
  fieldErr: null,
  banner: null,
  modal: null,
  holdFetch: false,
  fotoRetry: {},
  busy: false,
  view: { page: '' },
  mon: {},
  sheetRows: null,
  anomPage: 0,
  keepScroll: false,
};
const PAGE = 30;
const API_BASE = (document.querySelector('meta[name="api-base"]')?.getAttribute('content') || '').trim().replace(/\/$/, '');
const ICONS = {
  menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
  dash: '<path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z"/>',
  list: '<path d="M8 7h12M8 12h12M8 17h12M4 7h.01M4 12h.01M4 17h.01"/>',
  users: '<path d="M16 20v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 20v-1a3.5 3.5 0 0 0-3-3.45M16 3.13a4 4 0 0 1 0 7.75"/>',
  sheet: '<path d="M7 3h8l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM15 3v6h6M8 13h8M8 17h8"/>',
  out: '<path d="M10 7V5a2 2 0 0 1 2-2h7v18h-7a2 2 0 0 1-2-2v-2M15 12H3m0 0 3-3m-3 3 3 3"/>',
  moon: '<path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
};
let epoch = 0;
const liveUrls = new Set();

function icon(name) {
  return `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ''}</svg>`;
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmt(n) { return Number(n || 0).toLocaleString('id-ID'); }
function apiUrl(p) {
  if (/^https?:\/\//i.test(p)) return p;
  const path = p.startsWith('/') ? p : '/' + p;
  return (API_BASE || '') + path;
}
function fmtWib(iso) {
  const d = new Date(iso);
  if (!iso || Number.isNaN(d.getTime())) return 'waktu tidak tercatat WIB';
  const s = new Intl.DateTimeFormat('id-ID', {
    timeZone: 'Asia/Jakarta', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit',
  }).format(d);
  return s + ' WIB';
}
function jenisLabel(j) { return j === 'penggilingan' ? 'Penggilingan' : j === 'pengeringan' ? 'Pengeringan' : String(j || ''); }
function flagLabel(f) { return f === 'C' ? 'Cadangan' : f === 'U' ? 'Utama' : String(f || ''); }
function roleLabel(r) { return r === 'admin' ? 'Admin' : r === 'pml' ? 'PML' : r === 'mitra' ? 'Mitra' : String(r || ''); }
function orangText(o) {
  if (!o || (!o.nama && !o.id)) return '—';
  if (o.nama && o.id) return o.nama + ' (' + o.id + ')';
  return o.nama || o.id;
}
function statusMark(st) {
  const map = { belum: 'Belum', draf: 'Draf', sudah: 'Sudah', ditolak: 'Ditolak' };
  const k = map[st] ? st : 'belum';
  return `<span class="st st-${k}"><i></i>${map[k]}</span>`;
}
function staleHtml(meta) {
  if (!meta || meta.stale !== true) return '';
  return `<div class="stale" role="status">Data sumber terakhir disinkronkan ${esc(fmtWib(meta.syncedAt))}</div>`;
}
function errBlock(err) {
  if (!err) return '';
  const retry = err.retryAfter ? `<p class="retry">Retry-After: ${esc(err.retryAfter)}</p>` : '';
  return `<div class="err" role="alert"><p>${esc(err.message || '')}</p>${retry}</div>`;
}
function fieldMsg(name) {
  const msg = S.fieldErr && S.fieldErr[name];
  if (!msg) return '';
  return `<p class="fielderr" id="err-${esc(name)}">${esc(msg)}</p>`;
}
function errFrom(json, status, headers) {
  const e = json && json.error;
  let code = '', message = '', fields = null;
  if (e && typeof e === 'object') {
    code = String(e.code || '');
    message = typeof e.message === 'string' ? e.message : '';
    fields = e.fields && typeof e.fields === 'object' ? e.fields : null;
  } else if (typeof e === 'string') message = e;
  if (!message) message = 'Permintaan gagal (' + status + ').';
  const retry = headers && headers.get ? (headers.get('Retry-After') || '') : '';
  const err = new Error(message);
  err.status = status;
  err.code = code;
  err.fields = fields;
  err.retryAfter = retry;
  return err;
}
function clearSession() {
  S.token = '';
  S.user = null;
  S.me = null;
  S.cache = null;
  S.dash = null;
  S.akun = null;
  S.opsi = null;
  S.detailDoc = null;
  S.form = null;
  S.banner = null;
  S.modal = null;
  S.listMeta = null;
  S.fieldErr = null;
  S.holdFetch = false;
  S.fotoRetry = {};
  S.sheetRows = null;
  localStorage.removeItem('sp_session');
}
async function api(path, opt) {
  const options = opt || {};
  const headers = new Headers(options.headers || {});
  if (S.token && path !== '/api/login') headers.set('Authorization', 'Bearer ' + S.token);
  let body;
  if (options.json !== undefined) {
    headers.set('Content-Type', 'application/json');
    body = JSON.stringify(options.json);
  } else if (options.body != null) body = options.body;
  let res;
  try {
    res = await fetch(apiUrl(path), { method: options.method || 'GET', headers, body });
  } catch {
    const err = new Error('Gagal menghubungi server. Periksa sambungan.');
    err.status = 0;
    err.code = 'NETWORK';
    throw err;
  }
  const ct = res.headers.get('content-type') || '';
  if (res.status === 401 && path !== '/api/login') {
    let json = {};
    try { json = await res.json(); } catch { json = {}; }
    const err = errFrom(json, 401, res.headers);
    if (err.code === 'UNAUTHENTICATED' || !err.code) {
      clearSession();
      paintLogin();
    }
    throw err;
  }
  if (!res.ok) {
    let json = {};
    try { json = JSON.parse(await res.text() || '{}'); } catch { json = {}; }
    throw errFrom(json, res.status, res.headers);
  }
  if (options.raw) return res;
  if (ct.includes('json')) return res.json();
  return res;
}
function hashRoute() { return (location.hash || '').replace(/^#\/?/, ''); }
function go(route) {
  const next = String(route || '').replace(/^#\/?/, '');
  if (hashRoute() === next) { render(); return; }
  location.hash = next;
}
function homeRoute() { return S.user && S.user.role === 'mitra' ? 'kerja' : 'dasbor'; }
function routeAllowed(route) {
  if (!S.user) return false;
  const role = S.user.role;
  const top = (route || '').split('/')[0];
  if (!top) return false;
  if (role === 'mitra') return top === 'kerja' || top === 'sampel';
  if (role === 'pml') return top === 'dasbor' || top === 'mitra' || top === 'sampel';
  if (role === 'admin') {
    if (top === 'mon') {
      const b = (route || '').split('/')[1];
      return b === 'tp' || b === 'inpek' || b === 'horti';
    }
    return top === 'dasbor' || top === 'sampel' || top === 'akun';
  }
  return false;
}
function parts() {
  return hashRoute().split('/').filter(Boolean).map(s => {
    try { return decodeURIComponent(s); } catch { return s; }
  });
}
function navItems() {
  const role = S.user.role;
  if (role === 'mitra') return [{ href: 'kerja', label: 'Pekerjaan', icon: 'list' }];
  if (role === 'pml') return [{ href: 'dasbor', label: 'Dasbor', icon: 'dash' }];
  return [
    { href: 'dasbor', label: 'Dasbor', icon: 'dash', group: 'Utama' },
    { href: 'sampel', label: 'Sampel', icon: 'list' },
    { href: 'akun', label: 'Akun', icon: 'users' },
    { href: 'mon/tp', label: 'Tanaman Pangan', icon: 'sheet', group: 'Monitoring' },
    { href: 'mon/inpek', label: 'INPEK', icon: 'sheet' },
    { href: 'mon/horti', label: 'Horti, Perkebunan, Peternakan, Perikanan', icon: 'sheet' },
  ];
}
function navOn(href) {
  const h = hashRoute();
  if (href === 'sampel') return h === 'sampel' || h.startsWith('sampel/');
  return h === href;
}
function shell(content, meta) {
  const u = S.user;
  const items = navItems();
  let lastGroup = '';
  const links = items.map(it => {
    let grp = '';
    if (it.group && it.group !== lastGroup) {
      lastGroup = it.group;
      grp = `<div class="grp">${esc(it.group)}</div>`;
    }
    const on = navOn(it.href) ? ' on' : '';
    return `${grp}<a class="${on.trim()}" href="#${esc(it.href)}" aria-current="${on ? 'page' : 'false'}">${icon(it.icon)}<span>${esc(it.label)}</span></a>`;
  }).join('');
  const pml = u.role === 'mitra' && S.me && S.me.pml && S.me.pml.nama ? `<div>PML ${esc(S.me.pml.nama)}</div>` : '';
  return `<aside class="sb${S.navOpen ? ' open' : ''}" id="sb">
    <div class="brand"><b>SINTA PADI</b><small>Kabupaten Kebumen</small></div>
    <nav aria-label="Menu utama">${links}</nav>
    <div class="foot"><b>${esc(u.nama || '')}</b><div>${esc(u.id)} · ${esc(roleLabel(u.role))}</div>${pml}
      <button type="button" class="btn ghost" data-act="logout" style="margin-top:8px">Keluar</button>
    </div>
  </aside>
  ${S.navOpen ? '<button type="button" class="backdrop mob" data-act="close-nav" aria-label="Tutup menu"></button>' : ''}
  <header class="hdr">
    <div class="who"><b>SINTA PADI</b> · Kabupaten Kebumen</div>
    <div class="tools">
      <button type="button" class="iconbtn mob" data-act="nav" aria-label="Buka menu">${icon('menu')}</button>
      <button type="button" class="iconbtn" id="darkbtn" data-act="dark" aria-label="Mode gelap">${S.dark ? icon('sun') : icon('moon')}</button>
      <button type="button" class="btn ghost" data-act="logout">Keluar</button>
    </div>
  </header>
  <main class="main" id="isi">${staleHtml(meta)}${S.banner ? errBlock(S.banner) : ''}${content}</main>`;
}
function emptySource(err) {
  return `<section class="panel"><h1>Sumber tidak tersedia</h1><p>${esc(err && err.message || '')}</p><button type="button" class="btn" data-act="reload">Muat ulang</button></section>`;
}
function pageFail(err) {
  if (err && (err.code === 'SOURCE_UNAVAILABLE' || err.status === 503)) return emptySource(err);
  return `<section class="panel">${errBlock(err)}<button type="button" class="btn" data-act="reload">Muat ulang</button></section>`;

function paintLogin(err) {

async function loadPreviews(mine) {
  const imgs = [...document.querySelectorAll('img[data-src]')];
  await Promise.all(imgs.map(async img => {
    const remote = img.getAttribute('data-src');
    if (!remote) return;
    try {
      const headers = {};
      if (S.token) headers.Authorization = 'Bearer ' + S.token;
      const res = await fetch(apiUrl(remote), { headers });
      if (!res.ok || mine !== epoch || !img.isConnected) return;
      const blob = await res.blob();
      if (mine !== epoch || !img.isConnected) return;
      const obj = URL.createObjectURL(blob);
      liveUrls.add(obj);
      img.src = obj;
    } catch {
      if (img.isConnected) img.insertAdjacentHTML('afterend', '<p class="hint">Pratinjau gagal dimuat.</p>');
    }
  }));
}

async function render() {

      S.user = me.user;
      S.me = me;

      if (mine !== epoch) return;
      if (e.status === 401) return;
      paintLogin(e);

  if (!routeAllowed(hashRoute())) { location.replace('#' + homeRoute()); return; }

  try { built = await build(); }
  catch (e) {

    if (e.status === 401) return;

      if (typeof focusSel.start === 'number' && el.setSelectionRange) {
        try { el.setSelectionRange(focusSel.start, focusSel.end); } catch { /* input type */ }

  }

async function compressImage(file) {
  if (!file || !String(file.type || '').startsWith('image/')) {
    const err = new Error('Pilih berkas gambar.');
    err.code = 'LOCAL';
    throw err;
  }
  let bmp;
  try { bmp = await createImageBitmap(file); }
  catch {
    const err = new Error('Gambar tidak dapat dibaca.');
    err.code = 'LOCAL';
    throw err;
  }
  const max = 1600;
  const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width * scale));
  const h = Math.max(1, Math.round(bmp.height * scale));
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  canvas.getContext('2d').drawImage(bmp, 0, 0, w, h);
  if (bmp.close) bmp.close();
  const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.75));
  if (!blob) {
    const err = new Error('Gagal mengompres foto.');
    err.code = 'LOCAL';
    throw err;
  }
  if (blob.size > 2 * 1024 * 1024) {
    const err = new Error('Foto masih lebih besar dari 2 MB setelah dikompres. Pilih foto lain.');
    err.code = 'LOCAL';
    throw err;
  }
  return blob;
}
function uploadFoto(jenis, id, slot, blob, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', apiUrl('/api/sampel/' + jenis + '/' + encodeURIComponent(id) + '/foto/' + slot));
    if (S.token) xhr.setRequestHeader('Authorization', 'Bearer ' + S.token);
    xhr.upload.onprogress = ev => {
      if (ev.lengthComputable && onProgress) onProgress(ev.loaded / ev.total);
    };
    xhr.onload = () => {
      let json = {};
      try { json = JSON.parse(xhr.responseText || '{}'); } catch { json = {}; }
      const headers = { get: name => xhr.getResponseHeader(name) };
      if (xhr.status === 401) {
        const err = errFrom(json, 401, headers);
        if (err.code === 'UNAUTHENTICATED' || !err.code) { clearSession(); paintLogin(); }
        reject(err);
        return;
      }
      if (xhr.status >= 200 && xhr.status < 300) { resolve(json); return; }
      reject(errFrom(json, xhr.status, headers));
    };
    xhr.onerror = () => {
      const err = new Error('Gagal mengunggah. Periksa sambungan.');
      err.status = 0;
      err.code = 'NETWORK';
      reject(err);
    };
    const fd = new FormData();
    fd.append('file', blob, slot + '.jpg');
    xhr.send(fd);
  });
}

      return;
    }
    S.banner = e;
    if (e.fields) S.fieldErr = e.fields;
    render();
  }
}
async function onFoto(input) {
  const file = input.files && input.files[0];
  const slot = input.dataset.slot;
  input.value = '';
  if (!file || !slot) return;
  try {
    const blob = await compressImage(file);
    await kirimFoto(slot, blob);
  } catch (e) {
    const msg = document.querySelector('[data-foto-msg="' + slot + '"]');
    if (msg) msg.textContent = e.message || '';
    S.banner = e;
    const host = document.getElementById('isi');
    if (host && !host.querySelector(':scope > .err')) host.insertAdjacentHTML('afterbegin', errBlock(e));
  }
}
function whenReady(pred, ms) {
  return new Promise((resolve, reject) => {
    const t0 = Date.now();
    (function tick() {
      if (pred()) return resolve();
      if (Date.now() - t0 > (ms || 8000)) return reject(new Error('Pustaka unduh belum termuat. Periksa koneksi lalu coba lagi.'));
      setTimeout(tick, 40);
    })();
  });
}
function saveBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
async function exportPDF(title, cols, rows) {
  await whenReady(() => window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API && window.jspdf.jsPDF.API.autoTable);
  const doc = new window.jspdf.jsPDF({ orientation: cols.length > 7 ? 'landscape' : 'portrait', unit: 'pt' });
  doc.setFontSize(12);
  doc.text(title, 40, 36);
  doc.setFontSize(9);
  doc.text('SINTA PADI — Kabupaten Kebumen', 40, 52);
  doc.autoTable({
    head: [cols],
    body: rows.map(r => cols.map(c => String(r[c] == null ? '' : r[c]))),
    startY: 64,
    styles: { fontSize: 7 },
    headStyles: { fillColor: [15, 23, 42] },
  });
  doc.save(title.replace(/\s+/g, '_') + '.pdf');
}
async function exportXL(title, cols, rows) {
  await whenReady(() => window.XLSX && window.XLSX.utils);
  const data = rows.map(r => { const o = {}; cols.forEach(c => { o[c] = r[c] == null ? '' : r[c]; }); return o; });
  const ws = XLSX.utils.json_to_sheet(data, { header: cols });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Data');
  XLSX.writeFile(wb, title.replace(/\s+/g, '_') + '.xlsx');
}
async function exportSampel(kind) {
  const res = await api('/api/sampel');
  if (res.meta) S.listMeta = { syncedAt: res.meta.syncedAt, stale: res.meta.stale === true };
  const cols = ['Jenis', 'ID', 'Kecamatan', 'Desa', 'Nama', 'NKS', 'Flag', 'Mitra', 'PML', 'Status', 'Foto'];
  const data = (res.data || []).map(r => ({
    Jenis: jenisLabel(r.jenis), ID: r.id, Kecamatan: r.kecamatan, Desa: r.desa, Nama: r.nama || '',
    NKS: r.nks, Flag: flagLabel(r.flagSampel), Mitra: orangText(r.mitra), PML: orangText(r.pml),
    Status: r.status, Foto: (r.fotoTerisi ?? 0) + '/' + (r.fotoTotal ?? 12),
  }));
  if (kind === 'pdf') await exportPDF('Sampel SKGB Kebumen', cols, data);
  else await exportXL('Sampel_SKGB_Kebumen', cols, data);
}
async function exportCsv() {
  const res = await fetch(apiUrl('/api/admin/ekspor?format=csv'), { headers: { Authorization: 'Bearer ' + S.token } });
  if (res.status === 401) {
    let json = {};
    try { json = await res.json(); } catch { json = {}; }
    const err = errFrom(json, 401, res.headers);
    clearSession();
    paintLogin();
    throw err;
  }
  if (!res.ok) {
    let json = {};
    try { json = JSON.parse(await res.text() || '{}'); } catch { json = {}; }
    throw errFrom(json, res.status, res.headers);
  }
  saveBlob(await res.blob(), 'sinta-padi-kebumen.csv');
}
async function exportMon(kind) {
  const pack = S.sheetRows;
  if (!pack || !pack.rows || !pack.rows.length) return;
  const head = pack.rows[0].map((h, i) => h || ('Kolom ' + (i + 1)));
  const data = pack.rows.slice(1).map(r => {
    const o = {};
    head.forEach((h, i) => { o[h] = r[i] == null ? '' : r[i]; });
    return o;
  });
  if (kind === 'pdf') await exportPDF(pack.title || 'Monitoring', head, data);
  else await exportXL(pack.title || 'Monitoring', head, data);
}
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    S.banner = new Error('Tersalin.');
    S.banner.code = 'OK';
  } catch {
    S.banner = new Error('Gagal menyalin. Pilih ID lalu salin manual.');
  }
  const host = document.getElementById('isi');
  if (!host) return;
  const old = host.querySelector(':scope > .err');
  if (old) old.remove();
  host.insertAdjacentHTML('afterbegin', `<div class="lock" role="status">${esc(S.banner.message)}</div>`);
  S.banner = null;
}
function onClick(e) {
  const t = e.target.closest('[data-act], [data-set-mitra]');
  if (!t) return;
  if (t.dataset.setMitra != null) {
    S.listUi.mitra = t.dataset.setMitra;
    S.listUi.page = 0;
    S.cache = null;
  }
  const act = t.dataset.act;
  if (!act) return;
  if (act === 'nav' || act === 'close-nav') {
    S.navOpen = act === 'nav' ? !S.navOpen : false;
    const sb = document.getElementById('sb');
    if (sb) sb.classList.toggle('open', S.navOpen);
    const bd = document.querySelector('.backdrop');
    if (S.navOpen && sb && !bd) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'backdrop';
      b.setAttribute('data-act', 'close-nav');
      b.setAttribute('aria-label', 'Tutup menu');
      sb.insertAdjacentElement('afterend', b);
    } else if (!S.navOpen && bd) bd.remove();
    return;
  }
  if (act === 'dark') {
    S.dark = !S.dark;
    localStorage.setItem('sp_dark', S.dark ? '1' : '0');
    document.documentElement.classList.toggle('dark', S.dark);
    document.querySelectorAll('[data-act="dark"]').forEach(b => { b.innerHTML = S.dark ? icon('sun') : icon('moon'); });
    return;
  }
  if (act === 'logout') { logout(); return; }
  if (act === 'reload') {
    S.cache = null; S.dash = null; S.banner = null; S.holdFetch = false; S.keepScroll = true; render(); return;
  }
  if (act === 'page') {
    const bag = uiBag(t.dataset.ui);
    bag.page += Number(t.dataset.dir) || 0;
    S.keepScroll = true;
    render();
    return;
  }
  if (act === 'anom') { S.anomPage += Number(t.dataset.dir) || 0; S.keepScroll = true; render(); return; }
  if (act === 'save') { doSave(false); return; }
  if (act === 'koreksi') { doSave(false); return; }
  if (act === 'ask-kirim') {
    const form = readForm() || {};
    const jenis = S.view.jenis;
    const id = S.view.id;
    S.form = Object.assign({ _id: jenis + ':' + id }, form);
    const ktp = ((S.detailDoc && S.detailDoc.foto) || []).find(f => f.slot === 'ktp');
    if (!ktp || !ktp.terisi) {
      S.fieldErr = Object.assign({}, S.fieldErr, { ktp: 'Foto KTP wajib ada sebelum kirim.' });
      const err = new Error('Foto KTP wajib ada sebelum kirim.');
      err.code = 'LOCAL';
      err.fields = S.fieldErr;
      S.banner = err;
      render();
      return;
    }
    S.modal = { type: 'kirim' };
    render();
    return;
  }
  if (act === 'ask-tolak') {
    const form = readForm();
    if (form) S.form = Object.assign({ _id: S.view.jenis + ':' + S.view.id }, form);
    S.modal = { type: 'tolak', alasan: '' };
    render();
    return;
  }
  if (act === 'close-modal') { S.modal = null; render(); return; }
  if (act === 'keep-form') { S.modal = null; render(); return; }
  if (act === 'reload-detail') {
    S.form = null; S.modal = null; S.fieldErr = null; S.banner = null; S.holdFetch = false; render(); return;
  }
  if (act === 'retry-foto') {
    const slot = t.dataset.slot;
    const rec = S.fotoRetry && S.fotoRetry[slot];
    if (rec && rec.blob) kirimFoto(slot, rec.blob);
    return;
  }
  if (act === 'copy') { copyText(t.dataset.id || ''); return; }
  if (act === 'copy-all') {
    const lines = (S.akun || []).map(a => [a.id, a.nama, a.role].join('\t')).join('\n');
    copyText(lines);
    return;
  }
  if (act === 'csv' || act === 'pdf' || act === 'xlsx' || act === 'mon-pdf' || act === 'mon-xlsx') {
    const run = act === 'csv' ? exportCsv()
      : act === 'pdf' ? exportSampel('pdf')
      : act === 'xlsx' ? exportSampel('xlsx')
      : act === 'mon-pdf' ? exportMon('pdf')
      : exportMon('xlsx');
    run.catch(err => {
      if (err.status === 401) return;
      S.banner = err;
      render();
    });
    return;
  }
  if (act === 'mon-survei') {
    const st = S.mon[t.dataset.bidang];
    if (!st) return;
    st.survei = t.dataset.survei;
    st.idx = 0;
    st.page = 0;
    render();
    return;
  }
  if (act === 'mon-page') {
    const st = S.mon[t.dataset.bidang];
    if (!st) return;
    st.page += Number(t.dataset.dir) || 0;
    S.keepScroll = true;
    render();
  }
}
function onChange(e) {
  const t = e.target;
  if (t.matches('input[type=file][data-slot]')) { onFoto(t); return; }
  if (t.id === 'flt-jenis' || t.id === 'flt-status' || t.id === 'flt-mitra') {
    const bag = uiBag(t.dataset.ui || 'listUi');
    bag[t.dataset.k] = t.value;
    bag.page = 0;
    S.cache = null;
    S.keepScroll = true;
    render();
    return;
  }
  if (t.id === 'mon-sheet') {
    const st = S.mon[t.dataset.bidang];
    if (!st) return;
    st.idx = Number(t.value) || 0;
    st.page = 0;
    render();
  }
}
function onInput(e) {
  const t = e.target;
  if (t.name === 'alasan') {
    const n = document.getElementById('acount');
    if (n) n.textContent = String(t.value.length);
    if (S.modal) S.modal.alasan = t.value;
    return;
  }
  if (t.id === 'flt-q') {
    const bag = uiBag(t.dataset.ui || 'listUi');
    bag.q = t.value;
    bag.page = 0;
    S.keepScroll = true;
    render();
    return;
  }
  if (t.id === 'f-akun') {
    S.listUi.akunQ = t.value;
    S.keepScroll = true;
    render();
    return;
  }
  if (t.id === 'mon-q') {
    const st = S.mon[t.dataset.bidang];
    if (!st) return;
    st.q = t.value;
    st.page = 0;
    S.keepScroll = true;
    render();
  }
}
function onSubmit(e) {
  const formId = e.target && e.target.getAttribute ? e.target.getAttribute('id') : '';
  if (formId === 'login') { e.preventDefault(); doLogin(); }
  if (formId === 'dlg') {
    e.preventDefault();
    if (S.modal && S.modal.type === 'kirim') doSave(true);
    else if (S.modal && S.modal.type === 'tolak') doTolak();
  }
}
function onKey(e) {
  if (e.key === 'Escape' && S.modal) {
    if (S.modal.type === 'conflict' || S.modal.type === 'locked') S.modal = null;
    else S.modal = null;
    render();
  }
}
document.getElementById('app').addEventListener('click', onClick);
document.getElementById('app').addEventListener('change', onChange);
document.getElementById('app').addEventListener('input', onInput);
document.getElementById('app').addEventListener('submit', onSubmit);
document.addEventListener('keydown', onKey);
window.addEventListener('hashchange', () => { S.navOpen = false; window.scrollTo(0, 0); render(); });
(function boot() {
  if (S.dark) document.documentElement.classList.add('dark');
  const saved = localStorage.getItem('sp_session');
  if (saved) {
    try {
      const s = JSON.parse(saved);
      if (s && typeof s.token === 'string') S.token = s.token;
    } catch { localStorage.removeItem('sp_session'); }
  }
  render();
})();
</script>
</body>
