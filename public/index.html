.sb{position:fixed;left:0;top:0;bottom:0;width:250px;background:var(--navy);color:#fff;display:flex;flex-direction:column;z-index:50;transition:.2s}
.sb.min{width:64px}.sb.min .lbl{display:none}
.sb .logo{display:flex;gap:10px;align-items:center;padding:18px 16px}
.sb .logo .bx{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.sb .logo b{font-size:17px}.sb .logo small{display:block;font-size:9px;color:#94a3b8;letter-spacing:1px}

.card{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid #f1f5f9;padding:18px;margin-bottom:18px}
h1{font-size:24px;font-weight:900;font-style:italic;letter-spacing:-.5px}

.kpi .c .n{font-size:30px;font-weight:900}.kpi .c .l{font-size:10px;letter-spacing:2px;opacity:.85}.kpi .c .s{font-size:11px;opacity:.8;margin-top:4px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}

.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit}
.btn.g{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.btn.n{background:var(--navy);color:#fff}
.btn.w{background:#fff;border:1px solid #e2e8f0;color:#334155}

.sel,input,textarea{border:1px solid #e2e8f0;border-radius:10px;padding:9px 12px;font-family:inherit;font-size:13px;background:#fff;color:inherit}

.fld{margin-bottom:12px}.fld label{display:block;font-size:10px;font-weight:700;letter-spacing:1.5px;color:#64748b;margin-bottom:5px;text-transform:uppercase}

.donut{width:130px;height:130px;border-radius:50%;position:relative;margin:10px auto}
.donut::after{content:'';position:absolute;inset:18px;background:#fff;border-radius:50%}
.donut .p{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;font-weight:900}
.seg{display:inline-flex;background:#f1f5f9;border-radius:999px;padding:3px}

.bar{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2))}

.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ecfdf5,#f0fdfa)}
.login .c{background:#fff;border-radius:24px;padding:36px;width:380px;max-width:92vw;box-shadow:0 10px 40px rgba(16,185,129,.15);text-align:center}
.login .bx{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 14px}
.login h1{font-style:normal;letter-spacing:1px}
.login .f{text-align:left;margin-top:14px}

.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.mob{display:none}

.maptools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}

.mapleg{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center;margin-top:10px;font-size:12px;color:#475569}
.mapleg .item{display:inline-flex;align-items:center;gap:6px}
.mapleg .item.on{font-weight:800;color:#0f172a}
html.dark .mapleg{color:#cbd5e1}
html.dark .mapleg .item.on{color:#f8fafc}
.mapleg i{width:14px;height:14px;border-radius:2px;display:inline-block;border:1px solid rgba(15,23,42,.25);flex:none}
.mapscale{display:inline-flex;align-items:center;gap:3px}
.mapscale b{width:18px;height:8px;display:inline-block;border:1px solid rgba(15,23,42,.15)}
.pop-line{display:flex;justify-content:space-between;gap:18px;margin-top:4px;font-size:12px}
.pop-line.on{font-weight:800}

@media(max-width:900px){
 .sb{transform:translateX(-100%)}.sb.open{transform:none}
 .hdr,.main{margin-left:0;left:0}.sb.min~.hdr,.sb.min~.main{margin-left:0}
 .mob{display:inline-flex}

 .status-api{display:none}

 #map{height:320px}

<body>
<a class="skip" href="#isi">Lewati ke isi</a>
<noscript><p style="padding:24px;font-family:sans-serif">SINTA PADI membutuhkan JavaScript.</p></noscript>
<div id="app"></div>
<script>
/* ====== STATE ====== */
const S={user:null,route:'dashboard',tab:{},dark:localStorage.getItem('sp_dark')==='1',cache:{},map:null,layer:'ku',mapKab:''};
let epoch=0;
if(S.dark)document.documentElement.classList.add('dark');
const $=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('id-ID');
const pct=(a,b)=>{const n=Number(a)||0,d=Number(b)||0;return d?Math.round(n/d*100):0};
const normKab=s=>String(s||'').toUpperCase().replace(/\s+/g,' ').trim();
function sameKab(a,b){const x=normKab(a),y=normKab(b);return !!x&&(x===y||x==='KOTA '+y||y==='KOTA '+x);}
let CONST=null;
const toast=m=>{const t=$(`<div class="toast" role="status">${esc(m)}</div>`);document.body.appendChild(t);setTimeout(()=>t.remove(),3000)};
const API_BASE=(document.querySelector('meta[name="api-base"]')?.getAttribute('content')||'').trim().replace(/\/$/,'');
const GEO_KAB='https://raw.githubusercontent.com/rifani/geojson-political-indonesia/master/IDN_adm_2_kabkota.json';
function whenReady(pred,ms=8000){
  return new Promise((resolve,reject)=>{
    const t0=Date.now();
    (function tick(){
      if(pred()) return resolve();
      if(Date.now()-t0>ms) return reject(new Error('Pustaka belum termuat. Periksa koneksi lalu coba lagi.'));
      setTimeout(tick,40);
    })();
  });
}

/* ====== API ====== */
async function api(p,opt={}){
  const url=(API_BASE&&p.startsWith('/'))?API_BASE+p:p;
  const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(S.user?{Authorization:'Bearer '+S.user.token}:{}) ,...(opt.headers||{})}});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&p!=='/api/login'){localStorage.removeItem('sp_user');S.user=null;throw new Error('Sesi habis, login ulang');}
  return j;
}
const sheet=n=>api('/api/sheet/'+n);
function saveCache(n,d){S.cache[n]=d}
const getC=n=>S.cache[n];

/* ====== ROUTES ====== */
const ROUTES=[
 ['dashboard','Dashboard','🏠',''],['peta','Peta','🗺️',''],['ksa-mei','KSA Mei','🌾',''],['ksa-juni','KSA Juni','🌾',''],['identifikasi','Identifikasi Panen','📋',''],
 ['map-k','▸ Mapping Pengeringan','🔄',''],['map-g','▸ Mapping Penggilingan','🏭',''],
 ['peng-t1','▸ Pengeringan Kunjungan 1','💧',''],['peng-t2','▸ Pengeringan Kunjungan 2','💧',''],
 ['gil-dir','▸ Direktori Penggilingan','📞',''],['gil-in','▸ Input Hasil Observasi','⚙️',''],
 ['anom-k','▸ Anomali Kering','⚠️',''],['anom-g','▸ Anomali Giling','⚠️',''],
 ['monitoring','Monitoring GC','📊',''],['gs-tp','▸ Mon. Tanaman Pangan','📈','gs'],['gs-inpek','▸ Mon. INPEK','📈','gs'],['gs-horti','▸ Mon. Horti/Per/Pet/Perikanan','📈','gs'],['pengaturan','Pengaturan','⚙️','admin']
];
function go(r){
  if(!ROUTES.some(x=>x[0]===r)) r='dashboard';
  if(location.hash!=='#'+r){location.hash=r;return;}
  S.route=r;render();window.scrollTo(0,0);
}

/* ====== LOGIN ====== */
function renderLogin(){
  epoch++;
  document.getElementById('app').innerHTML=`
  <div class="login"><div class="c">
    <div class="bx">🌾</div>
    <h1>SINTA PADI</h1>
    <div style="font-size:10px;letter-spacing:2px;color:#64748b;font-weight:700;margin-bottom:8px">SISTEM INFORMASI SKGB JAWA TENGAH</div>
    <div style="font-size:11px;color:#94a3b8;margin-bottom:8px">PROVINSI JAWA TENGAH • 2026</div>
    <div class="f"><div class="fld"><label for="lu">Username (Kode Kabupaten)</label><input id="lu" autocomplete="username" placeholder="Contoh: 3301" style="width:100%"></div>
    <div class="fld"><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" placeholder="••••••••" style="width:100%"></div>
    <button type="button" class="btn g" id="lb" style="width:100%;padding:12px;font-size:14px">Masuk</button></div>
    <div id="lerr"></div>
    <div style="font-size:10px;color:#94a3b8;margin-top:16px;font-weight:600">HUBUNGI ADMIN BPS PROVINSI JAWA TENGAH JIKA LUPA PASSWORD</div>
  </div></div>`;
  const doLogin=async()=>{
    document.getElementById('lerr').innerHTML='';
    const j=await api('/api/login',{method:'POST',body:JSON.stringify({username:lu.value,password:lp.value})}).catch(e=>({ok:false,error:e.message}));
    if(j.ok){S.user={...j.user,token:j.token};localStorage.setItem('sp_user',JSON.stringify(S.user));go('identifikasi');}
    else document.getElementById('lerr').innerHTML=`<div class="err">${esc(j.error||'Login gagal')}</div>`;
  };
  lb.onclick=doLogin;
  [lu,lp].forEach(el=>el.onkeydown=e=>{if(e.key==='Enter')doLogin()});
}

/* ====== LAYOUT ====== */
async function logout(){
  const token=S.user&&S.user.token;
  localStorage.removeItem('sp_user');
  S.user=null;
  S.cache={};
  if(S.map){try{S.map.remove()}catch(e){}S.map=null}
  if(location.hash) history.replaceState(null,'',location.pathname+location.search);
  renderLogin();
  if(!token) return;
  const p='/api/logout';
  const url=(API_BASE&&p.startsWith('/'))?API_BASE+p:p;
  try{
    await fetch(url,{method:'POST',keepalive:true,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:'{}'});
  }catch(e){/* token klien sudah dihapus */ }
}
function layout(content){
  const u=S.user;
  return `<div class="sb ${S.sbmin?'min':''}" id="sb">
    <div class="logo"><div class="bx">🌾</div><div><b class="lbl">SINTA PADI</b><small class="lbl">SKGB JAWA TENGAH</small></div></div>
    <nav aria-label="Menu utama">${ROUTES.filter(r=>!r[3]||r[3]==='gs'||(r[3]==='admin'&&u.role!=='kab')).map(r=>`<a href="#${r[0]}" class="${S.route===r[0]?'on':''}" aria-current="${S.route===r[0]?'page':'false'}" onclick="go('${r[0]}');return false"><span aria-hidden="true">${r[2]}</span><span class="lbl">${esc(r[1])}</span></a>`).join('')}</nav>
    <div class="foot"><span class="lbl">${esc(u.kode)} · ${esc(u.nama)}</span><br><a href="#keluar" onclick="logout();return false" style="color:#f87171;font-size:11px;padding:4px 0">⏻ Logout</a></div>
  </div>
  <div class="hdr"><div class="t"><b>SINTA PADI</b> <small>PROVINSI JAWA TENGAH • 2026</small></div>
  <div class="r">
    <button type="button" class="btn w mob" aria-label="Buka menu" onclick="document.getElementById('sb').classList.toggle('open')">☰</button>
    <button type="button" class="btn w" onclick="toggleDark()" title="Mode gelap" aria-label="Mode gelap">${S.dark?'☀️':'🌙'}</button>
    <span class="status-api"><span class="dot" aria-hidden="true"></span> STATUS API</span>
    <div class="av" aria-hidden="true">${esc(u.kode.slice(-2))}</div>
    <button type="button" class="btn w" onclick="logout()">Logout</button>
  </div></div>
  <div class="main" id="isi">${content}</div>`;
}
function toggleDark(){S.dark=!S.dark;localStorage.setItem('sp_dark',S.dark?'1':'0');document.documentElement.classList.toggle('dark',S.dark);render()}

/* ====== PAGE HELPERS ====== */
function waBtn(no){const d=String(no||'').replace(/\D/g,'');if(!d||d==='-')return '<a class="wa off">WhatsApp</a>';
  let n=d;if(n.startsWith('0'))n='62'+n.slice(1);else if(n.startsWith('8'))n='62'+n;
  return `<a class="wa" target="_blank" href="https://wa.me/${n}">💬 WhatsApp</a>`}
async function exportPDF(title,cols,rows){
  try{await whenReady(()=>window.jspdf&&window.jspdf.jsPDF&&window.jspdf.jsPDF.API&&window.jspdf.jsPDF.API.autoTable);}catch(e){toast(e.message);return;}
  const doc=new window.jspdf.jsPDF({orientation:cols.length>7?'landscape':'portrait',unit:'pt'});
  doc.text(title,40,40);doc.setFontSize(9);doc.text('SINTA PADI — '+new Date().toLocaleDateString('id-ID'),40,56);
  doc.autoTable({head:[cols],body:rows.map(r=>cols.map(c=>String(r[c]??''))),startY:70,styles:{fontSize:7},headStyles:{fillColor:[15,23,42]}});
  doc.save(title.replace(/\s+/g,'_')+'.pdf');toast('PDF terunduh ✓');
}
async function exportXL(title,cols,rows){
  try{await whenReady(()=>window.XLSX&&window.XLSX.utils);}catch(e){toast(e.message);return;}
  const ws=XLSX.utils.json_to_sheet(rows.map(r=>{const o={};cols.forEach(c=>o[c]=r[c]);return o}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Data');
  XLSX.writeFile(wb,'SINTA_PADI_'+title.replace(/\s+/g,'_')+'_'+(S.user?S.user.kode:'')+'_'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'.xlsx');toast('Excel terunduh ✓');
}
const expBtns=(t,c,r)=>`<span style="display:inline-flex;gap:6px;margin-left:auto"><button class="btn n" onclick='exportPDF(${JSON.stringify(t)},${JSON.stringify(c)},${JSON.stringify(r)})'>📄 PDF</button><button class="btn g" onclick='exportXL(${JSON.stringify(t)},${JSON.stringify(c)},${JSON.stringify(r)})'>📊 EXCEL</button></span>`;

const MAP_LAYERS=[['ku','Sampel kering utama'],['kc','Sampel kering cadangan'],['kt1','Realisasi kering kunjungan 1'],['kt2','Realisasi kering kunjungan 2'],['kg','Realisasi penggilingan']];
const SCALE={ku:['#dcfce7','#bbf7d0','#86efac','#4ade80','#166534'],kc:['#ffedd5','#fed7aa','#fdba74','#fb923c','#c2410c'],lain:['#dcfce7','#bbf7d0','#86efac','#4ade80','#22c55e']};
function mapKabCode(){if(S.user&&S.user.role==='kab')return S.user.kode;return S.mapKab||''}
function realisasiUrl(){const kab=mapKabCode();return '/api/realisasi'+(kab?'?kab='+encodeURIComponent(kab):'')}
function layerLabel(key){const hit=MAP_LAYERS.find(x=>x[0]===key);return hit?hit[1]:'Nilai'}
function numOr0(v){const n=Number(v);return Number.isFinite(n)?n:0}
function layerVal(r){if(!r)return 0;if(S.layer==='ku')return numOr0(r.ku);if(S.layer==='kc')return numOr0(r.kc);if(S.layer==='kt1')return numOr0(r.rK);if(S.layer==='kt2')return numOr0(r.rK2);if(S.layer==='kg')return numOr0(r.rG);return 0}
function scaleFor(layer){return layer==='kc'?SCALE.kc:layer==='ku'?SCALE.ku:SCALE.lain}
function legendHtml(){
  const colors=scaleFor(S.layer);
  const item=(key,color,label)=>`<span class="item ${S.layer===key?'on':''}"><i style="background:${color}"></i>${label}</span>`;
  return item('ku','#166534','Sampel kering utama')+item('kc','#c2410c','Sampel kering cadangan')+`<span class="mapscale" aria-hidden="true">${colors.map(c=>`<b style="background:${c}"></b>`).join('')}</span><span>rendah – tinggi</span>`;
}
function popupHtml(row,label){
  if(!row) return `<b>${esc(label||'Kabupaten')}</b><div class="pop-line">Tidak ada data untuk filter ini.</div>`;
  const line=(key,title,val)=>`<div class="pop-line ${S.layer===key?'on':''}"><span>${title}</span><span>${fmt(val)}</span></div>`;
  const extra=S.layer!=='ku'&&S.layer!=='kc'?line(S.layer,layerLabel(S.layer),layerVal(row)):'';
  return `<div><b>${esc(row.nama)}</b> <span style="color:#64748b">${esc(row.kode)}</span>${line('ku','Sampel kering utama',numOr0(row.ku))}${line('kc','Sampel kering cadangan',numOr0(row.kc))}${extra}</div>`;
}
function fillFor(v,max,layer){const colors=scaleFor(layer);return colors[Math.min(colors.length-1,Math.floor(numOr0(v)/(max/4.01)))]}

    ${[['SAMPEL ELIGIBLE KERING','#d1fae5','#065f46',fmt(tot.tK)],['SAMPEL ELIGIBLE GILING','#ffedd5','#9a3412',fmt(tot.tG)],['TARGET KERING','#dbeafe','#1e40af',fmt(tot.tK)],['TARGET GILING','#ede9fe','#5b21b6',fmt(tot.tG)],['REALISASI KERING',null,'#065f46',`${fmt(tot.rK)} / ${fmt(tot.tK)}`],['REALISASI GILING',null,'#9d174d',`${fmt(tot.rG)} / ${fmt(tot.tG)}`]].map(([l,bg,fg,v])=>`<div style="border-radius:12px;padding:12px;background:${bg||'#fff'};border:1px solid #e2e8f0"><div style="font-size:9px;letter-spacing:1px;font-weight:800;color:#64748b">${l}</div><div style="font-size:18px;font-weight:900;color:${fg}">${v}</div></div>`).join('')}

async function loadJatengGeo(){
  if(S.geo) return S.geo;
  const gj=await(await fetch(GEO_KAB)).json();
  const features=(gj.features||[]).filter(f=>normKab(f.properties&&f.properties.NAME_1)==='JAWA TENGAH');
  S.geo={type:'FeatureCollection',features};
  return S.geo;
}
function rowForFeature(rows,f){
  const p=f.properties||{};
  const name=p.NAME_2||p.nama||p.Name||p.name||'';
  const alt=p.VARNAME_2||'';
  return rows.find(r=>sameKab(r.nama,name)||sameKab(r.nama,alt))||null;
}
let mapGen=0;
async function drawMap(){
  const gen=++mapGen;
  const el=document.getElementById('map');if(!el)return;
  const leg=document.getElementById('mapleg');if(leg)leg.innerHTML=legendHtml();
  const sel=document.getElementById('lselect');if(sel&&sel.value!==S.layer)sel.value=S.layer;
  if(typeof L==='undefined'){toast('Peta belum siap, coba lagi');return;}
  if(S.map){S.map.remove();S.map=null}
  const map=L.map(el).setView([-7.3,109.8],8);
  S.map=map;
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
  let gj;try{gj=await loadJatengGeo()}catch(e){gj=null}
  if(gen!==mapGen||!document.getElementById('map'))return;
  let rl;try{rl=await api(realisasiUrl())}catch(e){if(!S.user)return renderLogin();toast(e.message||'Gagal memuat peta');return}
  if(gen!==mapGen||!document.getElementById('map')||S.map!==map)return;
  const rows=rl.rows||[];
  const max=Math.max(...rows.map(layerVal),1);
  const kab=mapKabCode();
  let focus=null;
  if(gj&&gj.features&&gj.features.length){
    L.geoJSON(gj,{style:f=>{
      const row=rowForFeature(rows,f);
      if(!row) return {fillColor:'#e5e7eb',fillOpacity:.5,color:'#fff',weight:1};
      return {fillColor:fillFor(layerVal(row),max,S.layer),fillOpacity:.88,color:'#fff',weight:1};
    },onEachFeature:(f,l)=>{
      const row=rowForFeature(rows,f);
      const label=(f.properties&&(f.properties.NAME_2||f.properties.nama))||'';
      l.bindTooltip(label);
      l.bindPopup(popupHtml(row,label));
      if(row&&kab&&row.kode===kab) focus=l;
    }}).addTo(map);
    if(focus) map.fitBounds(focus.getBounds(),{padding:[24,24],maxZoom:10});
  }else toast('Batas kabupaten tidak termuat. Peta dasar tetap tampil.');
}

async function pgMapping(jenis){ // jenis 'k' or 'g'
  const isK=jenis==='k';
  const [utker,panen,dir]=await Promise.all([sheet('utker'),sheet('panen'),sheet('direktori')]);
  let html=`<h1>MAPPING PERGANTIAN SAMPEL — ${isK?'PENGERINGAN':'PENGGILINGAN'}</h1>`;
  if(isK){
    const cad=panen.data.filter(r=>r.jenis==='Cadangan'&&r.status==='Eligible');
    const rows=utker.data.filter(r=>!/-?C\d+$/.test(r.idsub));
    html+=`<div class="sub">Data dari sheet UTKer (kolom A, B, E) digabung dengan Panen (kolom M). Pilih Sampel Pengganti dari Cadangan Kering yang masih eligible, lalu simpan.</div>
    <div class="card"><div style="display:flex;gap:10px;margin-bottom:10px">${filterKab('fmk',true)}<input id="qmk" class="sel" placeholder="Cari ID…" oninput="drawMK()"><button class="btn w" onclick="render()">⟳</button></div><div id="mkbox" style="overflow-x:auto;max-height:460px;overflow-y:auto"></div></div>`;
    window.drawMK=()=>{
      const input=document.getElementById('qmk'), box=document.getElementById('mkbox');
      if(!input||!box) return;
      const q=(input.value||'').toLowerCase();
      const f=rows.filter(r=>(S.user.role==='kab'?r.kdkab===S.user.kode:true)&&(!q||r.idsub.toLowerCase().includes(q))).slice(0,150);
      box.innerHTML=`<table class="tbl"><tr><th>NO</th><th>KDKAB</th><th>IDSUBSEGMEN</th><th>STATUS ELIGIBLE</th><th>STATUS PROBABLE</th><th>SAMPEL PENGGANTI</th><th>AKSI</th></tr>
      ${f.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.kdkab)}</td><td><b>${esc(r.idsub)}</b></td><td><span class="badge ${r.status==='Eligible'?'b-g':'b-o'}">${esc(r.status)}</span></td><td>${esc(r.probable||'-')}</td>
      <td><select id="mp${i}" class="sel" style="padding:4px 8px"><option value="">-- Pilih Pengganti (Cadangan) --</option>${cad.filter(c=>c.kdkab===r.kdkab).map(c=>`<option ${c.id===r.pengganti?'selected':''} value="${esc(c.id)}">${esc(c.id)}</option>`).join('')}</select></td>
      <td><button class="btn g" style="padding:5px 10px" onclick="saveMK('${esc(r.idsub)}',${i})">Simpan</button></td></tr>`).join('')}</table>
      <div style="font-size:11px;color:#64748b;margin-top:6px">Menampilkan ${f.length} dari ${fmt(rows.length)} baris.</div>`;
    };
    window.saveMK=async(id,i)=>{
      const v=document.getElementById('mp'+i).value;
      if(!v)return toast('Pilih sampel pengganti dulu');
      const j=await api('/api/sheet/utker',{method:'POST',body:JSON.stringify({action:'updateCell',matchValue:id,targetColumn:'pengganti',value:v})});
      j.success?toast('Mapping tersimpan ✓'):toast('Gagal: '+(j.message||j.error));
    };
    setTimeout(drawMK,30);
  }else{
    const utama=dir.data.filter(r=>r.jenis==='UTAMA'&&(!S.user.role||S.user.role!=='kab'||r.kab===S.user.kode));
    const cad=dir.data.filter(r=>r.jenis==='CADANGAN');
    html+=`<div class="sub">Daftar penggilingan sampel Utama. Pilih sampel pengganti dari daftar penggilingan Cadangan jika diperlukan. <b>Menampilkan ${fmt(utama.length)} penggilingan utama</b></div>
    <div class="card"><div style="display:flex;gap:10px;margin-bottom:10px">${filterKab('fmg',true)}<input id="qmg" class="sel" placeholder="Nama penggilingan…" oninput="drawMG()"><button class="btn w" onclick="render()">⟳</button></div><div id="mgbox" style="overflow-x:auto;max-height:460px;overflow-y:auto"></div></div>`;
    window.drawMG=()=>{
      const input=document.getElementById('qmg'), box=document.getElementById('mgbox');
      if(!input||!box) return;
      const q=(input.value||'').toLowerCase();
      const f=utama.filter(r=>!q||r.nama.toLowerCase().includes(q)).slice(0,100);
      box.innerHTML=`<table class="tbl"><tr><th>NO</th><th>KAB</th><th>PENGGILINGAN UTAMA</th><th>SKALA</th><th>TELEPON</th><th>SAMPEL PENGGANTI</th><th>AKSI</th></tr>
      ${f.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.kab)}</td><td>${esc(r.nama)}</td><td>${esc(r.skala)}</td><td>${esc(r.telp||'-')}</td>
      <td><select id="mg${i}" class="sel" style="padding:4px 8px"><option value="">-- Pilih Pengganti (Cadangan) --</option>${cad.filter(c=>c.kab===r.kab).map(c=>`<option value="${esc(c.nama)}">${esc(c.nama)}</option>`).join('')}</select></td>
      <td><button class="btn g" style="padding:5px 10px" onclick="saveMG('${esc(r.nama)}',${i})">Simpan</button></td></tr>`).join('')}</table>`;
    };
    window.saveMG=async(nama,i)=>{
      const v=document.getElementById('mg'+i).value;
      const j=await api('/api/sheet/penggantigiling',{method:'POST',body:JSON.stringify({action:'submit',data:{kab:S.user.kode,pengUtama:nama,pengganti:v}})});
      j.success?toast('Mapping penggilingan tersimpan ✓'):toast('Gagal');
    };
    setTimeout(drawMG,30);
  }
  return html;
}

    <div class="fld"><label>JENIS SAMPEL</label><select id="g_js" class="sel" onchange="S.tab.gjs=this.value;S.tab.gpeng='';render()"><option value="">-- Pilih --</option><option ${jenis==='Utama'?'selected':''}>Utama</option><option ${jenis==='Cadangan'?'selected':''}>Cadangan</option></select></div>
    <div class="fld"><label>NAMA PENGGILINGAN</label><select id="g_np" class="sel" ${!jenis?'disabled':''} onchange="S.tab.gpeng=this.value;render()">${!jenis?'<option>-- Pilih Jenis dahulu --</option>':'<option value="">-- Pilih --</option>'+namaP.map(r=>`<option ${r.nama===selP?'selected':''}>${esc(r.nama)}</option>`).join('')}</select></div>
    <div class="fld"><label>SKALA (OTOMATIS)</label><input class="sel" disabled value="${info?esc(info.skala):(selP?'':'-')}"></div>
    <div class="fld"><label>TANGGAL PENDATAAN</label><input id="g_tgl" type="date" class="sel" style="width:100%"></div>
    <div class="fld"><label>LOKASI PENGGILINGAN</label><div style="display:flex;gap:6px"><input id="g_lok" class="sel" placeholder="Lat,Long" style="flex:1"><button type="button" class="btn w" aria-label="Isi lokasi dari GPS" onclick="gpsFill('g_lok')">📍</button></div></div>
    <div class="fld"><label>115. HASIL PENCACAHAN</label><select id="g_h" class="sel" onchange="gCond()"><option value="">-- Pilih --</option>${CONST.hasilPencacahan.map(o=>`<option>${o}</option>`).join('')}</select></div>
    <div id="gwrap" style="display:none;grid-column:1/-1"><div class="grid2">
    <div class="fld"><label>401.A. BERAT WADAH (GKG)</label><input id="g_a" type="number" class="sel" style="width:100%"></div>
    <div class="fld"><label>401.B. BERAT GABAH (GKG) + WADAH</label><input id="g_b" type="number" class="sel" style="width:100%"></div>
    <div class="fld"><label>401.C. RATA-RATA KADAR AIR (GKG)</label><input id="g_c" type="number" step="0.1" class="sel" style="width:100%"></div>
    <div class="fld"><label>403.A. BERAT WADAH (BERAS)</label><input id="g_d" type="number" class="sel" style="width:100%"></div>
    <div class="fld"><label>403.B. BERAT BERAS + WADAH</label><input id="g_e" type="number" class="sel" style="width:100%"></div>
    <div class="fld"><label>403.C. RATA-RATA KADAR AIR BERAS</label><input id="g_f" type="number" step="0.1" class="sel" style="width:100%"></div></div></div>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn w" onclick="S.tab.gjs='';render()">RESET</button><button class="btn g" onclick="submitGiling()">Kirim Data</button></div></div>`;
    window.gCond=()=>{gwrap.style.display=g_h.value===CONST.hasilPencacahan[0]?'':'none'};
    window.submitGiling=async()=>{
      if(!g_np.value||!g_h.value||!g_pt.value)return toast('Lengkapi field wajib');
      const ok=g_h.value===CONST.hasilPencacahan[0];
      const j=await api('/api/sheet/giling',{method:'POST',body:JSON.stringify({action:'submit',data:{kab:S.user.kode,petugas:g_pt.value,jenis:g_js.value,peng:g_np.value,skala:info?info.skala:'',tgl:g_tgl.value,lok:g_lok.value||'',hasil:g_h.value,gA:ok?g_a.value:'',gB:ok?g_b.value:'',gC:ok?g_c.value:'',bA:ok?g_d.value:'',bB:ok?g_e.value:'',bC:ok?g_f.value:''}})});
      if(j.success){toast('Hasil penggilingan terkirim ✓');render()}else toast('Gagal');
    };
  }else{
    const rows=gil.data.filter(r=>S.user.role==='kab'?r.kab===S.user.kode:true);
    const cols=gil.header;
    html+=`<div class="card">${expBtns('Hasil_Penggilingan',cols,rows)}<div style="overflow-x:auto"><table class="tbl"><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>
    ${rows.slice(0,200).map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.kab)}</td><td>${esc(r.petugas)}</td><td>${esc(r.jenis)}</td><td>${esc(r.peng)}</td><td>${esc(r.skala)}</td><td>${esc(r.tgl)}</td><td>${esc(r.lok)}</td><td>${esc(r.hasil)}</td><td>${esc(r.gA)}</td><td>${esc(r.gB)}</td><td>${esc(r.gC)}</td><td>${esc(r.bA)}</td><td>${esc(r.bB)}</td><td>${esc(r.bC)}</td></tr>`).join('')}</table></div></div>`;
  }
  return html;
}

async function pgAnomali(jenis){
  const isK=jenis==='k';
  const H=(CONST||await api('/api/constants')).hasilPencacahan[0];
  const gagal=r=>r.hasil!==H;
  if(!isK){
    const data=await sheet('giling');
    const rows=(data.data||[]).filter(gagal);
    return `<h1>ANOMALI GILING</h1><div class="sub">Pencacahan penggilingan yang gagal (hasil selain 1. Berhasil diwawancarai).</div>
    <div class="card"><div style="display:flex;gap:10px;align-items:center;margin-bottom:12px"><div style="background:#ffedd5;border-radius:12px;padding:12px 18px"><div style="font-size:9px;letter-spacing:1px;font-weight:800;color:#9a3412">TOTAL ANOMALI</div><div style="font-size:22px;font-weight:900;color:#9a3412">${fmt(rows.length)}</div></div><button class="btn w" onclick="render()">⟳ Refresh</button></div>
    <div style="overflow-x:auto;max-height:460px;overflow-y:auto"><table class="tbl"><tr><th>NO</th><th>KAB</th><th>PETUGAS</th><th>JENIS SAMPEL</th><th>NAMA PENGGILINGAN</th><th>HASIL PENCACAHAN</th></tr>
    ${rows.slice(0,100).map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.kab)}</td><td>${esc(r.petugas)}</td><td>${esc(r.jenis)}</td><td><b>${esc(r.peng||r.id||'')}</b></td><td><span class="badge b-r">${esc(r.hasil)}</span></td></tr>`).join('')||'<tr><td colspan="6" style="padding:20px">Tidak ada anomali</td></tr>'}</table></div></div>`;
  }
  const kunj=S.tab.anomK==='2'||S.tab.anomK==='semua'?S.tab.anomK:'1';
  const rowsOf=(d,name)=>{if(!d||!Array.isArray(d.data))throw new Error((d&&(d.error||d.message))||('Data '+name+' tidak terbaca'));return d.data};
  const parts=[];
  if(kunj==='1'||kunj==='semua') parts.push(...rowsOf(await sheet('kering1'),'kering1').filter(gagal).map(r=>({...r,kunj:'1'})));
  if(kunj==='2'||kunj==='semua') parts.push(...rowsOf(await sheet('kering2'),'kering2').filter(gagal).map(r=>({...r,kunj:'2'})));
  const tabBtn=(id,label)=>`<button type="button" class="${kunj===id?'on':''}" onclick="S.tab.anomK='${id}';render()">${label}</button>`;
  const sub=kunj==='1'?'Sumber: kunjungan 1 (saat panen).':kunj==='2'?'Sumber: kunjungan 2 (saat pengeringan).':'Sumber: kunjungan 1 dan 2. Kolom kunjungan membedakan barisnya.';
  return `<h1>ANOMALI KERING</h1><div class="sub">Pencacahan pengeringan yang gagal (hasil selain 1. Berhasil diwawancarai). ${sub}</div>
  <div class="tabs">${tabBtn('1','Kunjungan 1')}${tabBtn('2','Kunjungan 2')}${tabBtn('semua','Semua')}</div>
  <div class="card"><div style="display:flex;gap:10px;align-items:center;margin-bottom:12px"><div style="background:#ffedd5;border-radius:12px;padding:12px 18px"><div style="font-size:9px;letter-spacing:1px;font-weight:800;color:#9a3412">TOTAL ANOMALI</div><div style="font-size:22px;font-weight:900;color:#9a3412">${fmt(parts.length)}</div></div><button class="btn w" onclick="render()">⟳ Refresh</button></div>
  <div style="overflow-x:auto;max-height:460px;overflow-y:auto"><table class="tbl"><tr><th>NO</th><th>KUNJUNGAN</th><th>KAB</th><th>PETUGAS</th><th>JENIS SAMPEL</th><th>ID SUBSEGMEN</th><th>HASIL PENCACAHAN</th></tr>
  ${parts.slice(0,100).map((r,i)=>`<tr><td>${i+1}</td><td>Kunjungan ${esc(r.kunj)}</td><td>${esc(r.kab)}</td><td>${esc(r.petugas)}</td><td>${esc(r.jenis)}</td><td><b>${esc(r.id||'')}</b></td><td><span class="badge b-r">${esc(r.hasil)}</span></td></tr>`).join('')||'<tr><td colspan="7" style="padding:20px">Tidak ada anomali</td></tr>'}</table></div>
  <div style="font-size:11px;color:#64748b;margin-top:6px">Menampilkan ${fmt(Math.min(100,parts.length))} dari ${fmt(parts.length)} baris.</div></div>`;
}

async function pgPengaturan(){
  let html=`<h1>PENGATURAN</h1><div class="sub">Konfigurasi aplikasi SINTA PADI.</div>`;
  if(S.user.role==='superadmin'){
    const u=await api('/api/users');
    html+=`<div class="card"><b>Kelola Pengguna (Superadmin)</b><div class="sub">Login kode kabupaten: password = kode.</div>
    <table class="tbl"><tr><th>KODE</th><th>NAMA</th><th>ROLE</th></tr>${u.users.map(x=>`<tr><td><b>${esc(x.kode)}</b></td><td>${esc(x.nama)}</td><td><span class="badge ${x.role==='kab'?'b-bl':'b-g'}">${esc(x.role)}</span></td></tr>`).join('')}</table></div>`;
  }else{
    html+=`<div class="card"><b>Informasi Sesi</b><table class="tbl"><tr><th>Kode</th><td>${esc(S.user.kode)}</td></tr><tr><th>Nama</th><td>${esc(S.user.nama)}</td></tr><tr><th>Role</th><td>${esc(S.user.role)}</td></tr></table></div>`;
  }
  html+=`<div class="card"><b>Tema</b><button class="btn w" onclick="toggleDark()">${S.dark?'☀️ Light Mode':'🌙 Dark Mode'}</button></div>`;
  return html;
}

async function pgGSheets(bidang){
  const cfg=((await api('/api/gsheets')).sheets||[]).filter(x=>x.bidang===bidang);
  const B={tp:'STATISTIK TANAMAN PANGAN',inpek:'STATISTIK INPEK',horti:'STATISTIK HORTI, PERKEBUNAN, PETERNAKAN & PERIKANAN'}[bidang];
  if(!cfg.length) return `<h1>MONITORING SURVEI</h1><div class="sub">${esc(B||bidang)}</div><div class="card"><div class="err">Konfigurasi Google Sheet untuk bidang ini kosong.</div></div>`;
  const surv=[...new Set(cfg.map(c=>c.survei))];
  const cur=surv.includes(S.tab['gs'+bidang])?S.tab['gs'+bidang]:surv[0];
  const sheets=cfg.filter(c=>c.survei===cur);
  let idx=+(S.tab['gssid'+bidang]||0);
  if(!Number.isInteger(idx)||idx<0||idx>=sheets.length) idx=0;
  const sid=sheets[idx].sid,gid=sheets[idx].gid;
  let dataRows=null,err=null;
  try{const j=await api('/api/gsheet?sid='+encodeURIComponent(sid)+'&gid='+encodeURIComponent(gid));dataRows=j.rows}catch(e){err=e.message}
  let html=`<h1>MONITORING SURVEI</h1><div class="sub">${B} — data LIVE dari Google Sheets resmi BPS Kebumen (monitoringproduksi3305). <span class="badge b-g">LIVE DATA</span></div>
  <div class="tabs">${surv.map(sv=>`<button class="${sv===cur?'on':''}" onclick="S.tab['gs${bidang}']='${sv.replace(/'/g,'')}';S.tab['gssid${bidang}']=0;render()">${esc(sv)}</button>`).join('')}</div>`;
  html+=`<div class="card"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
  ${sheets.length>1?`<select id="gssel" class="sel" onchange="S.tab['gssid${bidang}']=this.value;render()">${sheets.map((c,i)=>`<option value="${i}" ${i==(+(S.tab['gssid'+bidang]||0))?'selected':''}>${esc(c.label)}</option>`).join('')}</select>`:`<b>${esc(sheets[0].label)}</b>`}
  <a class="btn n" target="_blank" href="https://docs.google.com/spreadsheets/d/${sid}/edit?gid=${gid}#gid=${gid}">↗ Buka Sheet Asli</a>
  ${dataRows?expBtns('Monitoring_'+cur,dataRows[0]||[],dataRows.slice(1).map(r=>Object.fromEntries((dataRows[0]||[]).map((h,i)=>[h,r[i]])))):''}
  </div>`;
  if(err){html+=`<div class="err">⚠️ Gagal memuat: ${esc(err)} — coba Refresh</div>`}
  else if(dataRows){
    const head=dataRows[0],rows=dataRows.slice(1);
    html+=`<div style="font-size:11px;color:#16a34a;margin-bottom:8px">● ${fmt(rows.length)} baris data real • sumber: Google Sheets BPS • diperbarui tiap 5 menit</div>
    <div style="overflow-x:auto;max-height:520px;overflow-y:auto"><table class="tbl"><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>
    ${rows.slice(0,300).map((r,ri)=>`<tr>${head.map((h,ci)=>`<td>${esc(r[ci])}</td>`).join('')}</tr>`).join('')}</table></div>
    <div style="font-size:11px;color:#64748b;margin-top:6px">Menampilkan ${Math.min(300,rows.length)} dari ${fmt(rows.length)} baris.</div>`;
  }
  html+='</div>';
  return html;
}

/* ====== ROUTER ====== */
const PAGES={
  dashboard:pgDashboard,peta:pgPeta,identifikasi:pgIdentifikasi,
  'ksa-mei':()=>pgKSA('Mei'),'ksa-juni':()=>pgKSA('Juni'),
  'map-k':()=>pgMapping('k'),'map-g':()=>pgMapping('g'),
  'peng-t1':()=>pgPengeringan(1),'peng-t2':()=>pgPengeringan(2),
  'gil-dir':pgDirektori,'gil-in':pgGilingInput,
  'anom-k':()=>pgAnomali('k'),'anom-g':()=>pgAnomali('g'),
  monitoring:pgIdentifikasi,'gs-tp':()=>pgGSheets('tp'),'gs-inpek':()=>pgGSheets('inpek'),'gs-horti':()=>pgGSheets('horti'),pengaturan:pgPengaturan
};
async function render(){
  const mine=++epoch;
  const app=document.getElementById('app');
  if(!S.user){
    const saved=localStorage.getItem('sp_user');
    if(saved){try{S.user=JSON.parse(saved)}catch(e){localStorage.removeItem('sp_user');S.user=null}}
    if(!S.user){if(mine===epoch)renderLogin();return}
    try{const j=await api('/api/me');if(mine!==epoch)return;S.user={...S.user,...j.user}}
    catch(e){if(mine!==epoch)return;S.user=null;localStorage.removeItem('sp_user');return renderLogin()}
  }
  if(mine!==epoch||!S.user)return;
  if(!CONST){
    try{CONST=await api('/api/constants')}
    catch(e){
      if(mine!==epoch)return;
      if(!S.user)return renderLogin();
      app.innerHTML=layout('<div class="card"><h1>Gagal memuat</h1><div class="sub">'+esc(e.message||e)+'</div><button class="btn g" onclick="render()">⟳ Coba Lagi</button></div>');
      return;
    }
  }
  if(mine!==epoch||!S.user)return;
  if(S.route==='monitoring'){S.tab.ident='gc'}
  if(S.route==='monitoring'&&S.tab.ident==='gc'){
    const html=layout(await (async()=>{const inner=await pgIdentifikasi();return inner.split('<div class="tabs">')[0]+'<div class="tabs"><button onclick="S.tab.ident=\'lookup\';go(\'identifikasi\')">Lookup Database</button><button onclick="S.tab.ident=\'input\';go(\'identifikasi\')">Input Hasil</button><button class="on">Monitoring GC</button></div>'+(await (async()=>{const m=await pgIdentifikasi();return m.split('Monitoring GC</button>').pop()})())})());
    if(mine!==epoch||!S.user)return;
    app.innerHTML=html;return;
  }
  const page=PAGES[S.route]||pgDashboard;
  try{
    const html=layout(await page());
    if(mine!==epoch||!S.user)return;
    app.innerHTML=html;
  }
  catch(e){
    if(mine!==epoch)return;
    if(!S.user) return renderLogin();
    app.innerHTML=layout('<div class="card"><h1>Gagal memuat halaman</h1><div class="sub">'+esc(e.message||e)+'</div><button class="btn g" onclick="render()">⟳ Coba Lagi</button></div>');
  }
}
window.go=go;window.logout=logout;window.S=S;window.toggleDark=toggleDark;
let bootRedirect=false;
(function(){
  const path=location.pathname.replace(/^\/+|\/+$/g,'').replace(/\.html$/,'');
  if(path&&path!=='index'&&ROUTES.some(r=>r[0]===path)&&!location.hash){
    bootRedirect=true;location.replace('/#'+path);return;
  }
  const h=(location.hash||'').replace(/^#/,'');
  if(h&&ROUTES.some(r=>r[0]===h)) S.route=h;
})();
window.addEventListener('hashchange',()=>{
  const r=(location.hash||'#dashboard').slice(1);
  if(!ROUTES.some(x=>x[0]===r)) return;
  S.route=r;render();window.scrollTo(0,0);
});
if(!bootRedirect) render();
</script>
