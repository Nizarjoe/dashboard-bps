<!DOCTYPE html>
<html lang="id">
<head>

<title>SINTA PADI — Kabupaten Kebumen</title>

<style>
:root{--bg:#efefef;--paper:#fff;--ink:#1c1c1c;--muted:#8d8d8d;--line:#e6e6e6;--lime:#b6d94c;--lime-2:#d7ec86;--grain:#e2b340;--soil:#8d5a3c;--clay:#c4503a;--track:#ececec;--radius:18px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{color-scheme:light}
html.dark{color-scheme:dark}
body{font-family:Outfit,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #6d8a1e;outline-offset:2px}
.skip{position:absolute;left:-999px;top:8px;background:#fff;color:#0f172a;padding:8px 12px;z-index:90}
.skip:focus{left:8px}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.sb{position:fixed;z-index:50;top:0;bottom:0;left:0;width:248px;background:#fff;color:var(--ink);display:flex;flex-direction:column;border-right:1px solid var(--line)}
.sb.min{width:76px}
.sb.min .lbl,.sb.min .grp,.sb.min .brand small,.sb.min .foot .meta,.sb.min .badge-n{display:none}
.brand{padding:22px 18px 8px}
.brand b{display:block;font-size:15px;letter-spacing:.08em;font-weight:700}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:2px;font-weight:500}
.sb nav{flex:1;overflow:auto;padding:8px 0 12px}
.sb .grp{margin:16px 18px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#a3a3a3;font-weight:600}
.sb a,.sb .textbtn{display:flex;align-items:center;gap:10px;min-height:42px;margin:2px 10px;padding:0 12px;color:#3a3a3a;text-decoration:none;font-size:14px;font-weight:560;border:0;background:transparent;border-radius:12px;text-align:left;cursor:pointer;width:calc(100% - 20px)}
.sb a.sub{margin-left:18px;width:calc(100% - 28px);font-weight:500}
.sb a:hover,.sb .textbtn:hover{background:#f6f6f6}
.sb a.on{background:#f1f1f1;color:#111;font-weight:650}
.badge-n{margin-left:auto;background:#161616;color:#fff;border-radius:999px;font-size:10px;line-height:1;padding:3px 6px;font-weight:700}
.sb .foot{padding:8px 10px 16px}
.sb .foot .meta{padding:8px 12px 10px;font-size:12px;color:var(--muted)}
.sb .foot .meta b{display:block;color:var(--ink);font-size:13px}
.hdr{position:fixed;z-index:40;top:0;left:248px;right:0;height:72px;display:flex;align-items:center;gap:12px;padding:0 22px;background:var(--bg)}
.sb.min~.hdr{left:76px}
.search{flex:1;min-width:0}
.search-inp{width:100%;height:44px;border:0;border-radius:999px;background:#fff;padding:0 18px;font-size:14px}
.hdr .tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.chip{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:6px 12px 6px 6px;min-height:44px}
.chip b{display:block;font-size:13px;line-height:1.15}
.chip small{display:block;color:var(--muted);font-size:11px}
.ava{width:32px;height:32px;border-radius:8px;background:var(--lime);color:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.main{margin-left:248px;margin-top:72px;padding:6px 22px 48px}
.sb.min~.main{margin-left:76px}
.backdrop{position:fixed;inset:0;z-index:45;border:0;background:rgba(15,23,42,.45)}
h1{font-size:28px;line-height:1.15;margin:0 0 4px;font-weight:700;letter-spacing:-.03em}
h2{font-size:16px;margin:0;font-weight:700}
.sub{color:var(--muted);margin:0 0 16px;font-size:14px}
.panel{background:var(--paper);border-radius:var(--radius);padding:18px 20px 20px;margin:0 0 18px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.mini{height:34px;min-height:34px;border:1px solid #e4e4e4;border-radius:10px;background:#fff;padding:0 10px;font-size:13px;font-weight:600}
.rowline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.filters label,.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.inp,select.inp,textarea.inp{min-height:44px;border:1px solid #e4e4e4;border-radius:12px;padding:8px 12px;background:#fff;width:100%}
textarea.inp{min-height:96px;resize:vertical}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid transparent;background:var(--lime);color:#1a1a1a;font-weight:700;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #e4e4e4}
.btn.warn{background:var(--clay);color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}
.iconbtn{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;border:0;background:#fff;border-radius:12px;color:inherit;cursor:pointer}
.ico{width:18px;height:18px;display:block}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;white-space:nowrap}
.st i{width:8px;height:8px;background:currentColor;display:block}
.st-belum{color:#6e6e6e}
.st-draf{color:#9a7420}
.st-sudah{color:#4d6b12}
.st-ditolak{color:var(--clay)}
.prog{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;font-size:14px}
.hit{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:56px;padding:8px 4px;border:0;border-bottom:1px solid #f0f0f0;background:transparent;cursor:pointer;color:inherit;text-decoration:none;border-radius:10px}
.hit:hover{background:#fafafa}
.sq{width:36px;height:36px;border-radius:10px;background:#f3f3f3;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.hit .grow{flex:1;min-width:0}
.hit small{display:block;color:var(--muted);font-size:12px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:#fff;position:sticky;top:0}
.tbl a{color:#3f5c10;font-weight:700}
.scroller,.scroller-x{overflow:auto;max-height:68vh}
.scroller-x .tbl{min-width:720px}
.ringkas{max-height:240px;overflow:auto}
.feat{background:#f6f4ef;border-radius:18px;padding:16px 18px;margin:0 0 18px}
.feat h2{margin:0 0 6px}
.warn-note{color:#8d5a3c;font-size:13px;font-weight:600}
.kv{display:grid;grid-template-columns:minmax(120px,180px) 1fr;gap:6px 12px;margin:0}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0}
.fld .fielderr,.fielderr{color:var(--red);font-size:13px;font-weight:700;margin:4px 0 0}
.err{background:#fef2f2;color:#7f1d1d;border:1px solid #fecaca;border-radius:6px;padding:10px 12px;margin:0 0 12px}
.err p{margin:0}
.err .retry{margin-top:6px;font-weight:700}
.stale{background:#fffbeb;color:#78350f;border:1px solid #fde68a;border-radius:6px;padding:8px 10px;margin:0 0 12px;font-size:13px}
.lock{background:#f8fafc;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:0 0 12px}
.reject{background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:10px 12px;margin:0 0 12px}
.reject b{display:block;color:var(--red);margin-bottom:4px}
.note{margin:6px 0 0;font-size:14px}
.slot{padding:12px 0;border-top:1px solid var(--line)}
.slot .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.slot img{display:block;width:160px;max-width:100%;height:120px;object-fit:cover;background:#f1f5f9;margin:8px 0}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filebtn{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;font-weight:700;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.meter{height:8px;background:#e2e8f0;margin-top:8px}
.meter i{display:block;height:100%;width:0;background:var(--lime)}
.hint{color:var(--muted);font-size:12px;margin:4px 0 0}
.modal{position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .panel{width:min(440px,100%);margin:0}
.boot{padding:24px}
.mob{display:none}
.pager{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.pager span{white-space:nowrap}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.tabs button{min-height:44px;padding:0 12px;border:1px solid #cbd5e1;background:#fff;border-radius:6px;cursor:pointer;font-weight:600}
.tabs button{border-radius:999px}
.tabs button.on{background:#f1f1f1;color:#111;border-color:#f1f1f1}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px;background:var(--bg)}
.login-card{width:min(420px,100%)}
.login-card h1{letter-spacing:.08em;font-size:26px}
.dash{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(240px,.75fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px}
.stack .panel{margin:0}
.kpi b{display:block;font-size:40px;line-height:1;letter-spacing:-.04em;font-weight:700}
.kpi span{display:block;margin-top:6px;color:var(--muted);font-size:13px}
.bars{display:flex;align-items:flex-end;gap:10px;height:190px;padding-top:28px}
.barcol{position:relative;flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.barstack{width:100%;max-width:28px;border-radius:8px 8px 3px 3px;background:var(--track);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.bar-done{display:block;width:100%;background:repeating-linear-gradient(-45deg,#b6d94c,#b6d94c 3px,#c8e56a 3px,#c8e56a 6px)}
.bar-rest{display:block;width:100%;flex:1;background:#e4e4e4}
.barcol.on .bar-done{background:repeating-linear-gradient(-45deg,#e2b340,#e2b340 3px,#b6d94c 3px,#b6d94c 6px)}
.barcol small{display:block;margin-top:6px;font-size:10px;color:var(--muted);text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tip{display:none;position:absolute;left:50%;bottom:calc(100% - 22px);transform:translateX(-50%);background:#fff;border-radius:12px;padding:8px 10px;font-size:12px;white-space:nowrap;z-index:3;box-shadow:0 8px 20px rgba(0,0,0,.06)}
.barcol:hover .tip,.barcol:focus-within .tip{display:block}
.segbar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--track)}
.segbar i{display:block;height:100%}
.legend{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.legend li{display:flex;align-items:center;gap:8px}
.sw{width:10px;height:10px;border-radius:2px;flex:none}
.gauge{position:relative;height:118px}
.gauge svg{width:100%;height:110px;display:block}
.gauge-n{position:absolute;left:0;right:0;bottom:8px;text-align:center}
.gauge-n b{font-size:32px;letter-spacing:-.04em}
.gauge-n small{display:block;color:var(--muted);font-size:12px}
.goal{margin:0 0 12px}
.goal-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:6px}
.track{height:8px;border-radius:999px;background:var(--track);overflow:hidden}
.track i{display:block;height:100%;background:repeating-linear-gradient(-45deg,#b6d94c,#b6d94c 3px,#c8e56a 3px,#c8e56a 6px)}
.tx{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f2f2f2}
.tx .grow{flex:1;min-width:0}
.tx small{display:block;color:var(--muted)}
.tx .side{text-align:right;font-size:12px;font-weight:600;max-width:46%}
html.dark{color-scheme:dark}
html.dark body{background:#171714;color:#f3f3ee}
html.dark .sb,html.dark .panel,html.dark .hdr,html.dark .chip,html.dark .iconbtn,html.dark .search-inp,html.dark .btn.ghost,html.dark .filebtn,html.dark .inp,html.dark select.inp,html.dark textarea.inp,html.dark .tabs button,html.dark .mini,html.dark .tip{background:#22221f;color:#f3f3ee;border-color:#34342f}
html.dark .sb{border-right-color:#34342f}
html.dark .sb a,html.dark .sb .textbtn{color:#ddd}
html.dark .sb a.on,html.dark .sb a:hover,html.dark .sb .textbtn:hover,html.dark .tabs button.on{background:#2e2e2a;color:#fff}
html.dark .tbl th{background:#22221f;color:#aaa}
html.dark .tbl td,html.dark .tbl th{border-color:#34342f}
html.dark .hit:hover{background:#2a2a26}
html.dark .sub,html.dark .hint,html.dark .kv dt,html.dark .filters label,html.dark .fld,html.dark .kpi span,html.dark .chip small{color:#a9a9a0}
html.dark .sq{background:#2e2e2a}
html.dark .stale{background:#3a3218;color:#f0d48a;border-color:#6a5420}
html.dark .err,html.dark .reject{background:#3a221c;color:#fecaca;border-color:#6a3328}
html.dark .lock{background:#22221f;border:1px solid #34342f}
html.dark .st-sudah{color:#d7ec86}
html.dark .st-draf{color:#e2b340}
html.dark .st-ditolak{color:#f0a090}
html.dark .tbl a{color:#d7ec86}
html.dark .meter,html.dark .track,html.dark .segbar{background:#333}
html.dark .bar-rest{background:#3a3a36}
html.dark .login-wrap{background:#171714}
@media(max-width:900px){
  .dash{grid-template-columns:1fr}
  .chip .who2{display:none}
}
@media(max-width:800px){
  .mob{display:inline-flex}
  .sb{transform:translateX(-105%);width:min(280px,88vw)}
  .sb.open{transform:none}
  .sb.min{width:min(280px,88vw)}
  .hdr,.main,.sb.min~.hdr,.sb.min~.main{left:0;margin-left:0}
  .hdr{height:auto;flex-wrap:wrap;padding:10px 12px}
  .main{padding:8px 12px 36px}
  .search{flex:1 1 140px}
  .kv{grid-template-columns:1fr}
  .kpi b{font-size:34px}
}
@media print{.sb,.hdr,.btn,.iconbtn,.filters{display:none!important}.main{margin:0}}
</style>
</head>

<noscript><p style="padding:24px;font-family:sans-serif">SINTA PADI membutuhkan JavaScript.</p></noscript>
<div id="app"></div>
<script>
const S = {
  token: '',
  user: null,
  me: null,
  dark: localStorage.getItem('sp_dark') === '1',
  navOpen: false,
  listUi: { jenis: '', status: '', mitra: '', q: '', page: 0 },
  drill: { jenis: '', status: '', q: '', page: 0 },
  cache: null,
  akun: null,
  opsi: null,
  dash: null,
  listMeta: null,
  detailKey: '',
  detailDoc: null,
  form: null,
  fieldErr: null,
  banner: null,
  modal: null,
  holdFetch: false,
  fotoRetry: {},
  busy: false,
  sbmin: localStorage.getItem('sp_min') === '1',
  kecSort: 'sudah',
  dashQ: '',
  view: { page: '' },
  mon: {},
  sheetRows: null,
  anomPage: 0,
  keepScroll: false,
  dashPath: '',
  dashReadyPath: '',
  dashErr: null,
  dashReload: false,
  listReload: false,
  listHold: null,
};
const PAGE = 30;
const TIMEOUT_MS = 25000;
const API_BASE = (document.querySelector('meta[name="api-base"]')?.getAttribute('content') || '').trim().replace(/\/$/, '');
const ICONS = {
  menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
  dash: '<path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z"/>',
  list: '<path d="M8 7h12M8 12h12M8 17h12M4 7h.01M4 12h.01M4 17h.01"/>',
  users: '<path d="M16 20v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 20v-1a3.5 3.5 0 0 0-3-3.45M16 3.13a4 4 0 0 1 0 7.75"/>',
  sheet: '<path d="M7 3h8l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM15 3v6h6M8 13h8M8 17h8"/>',
  out: '<path d="M10 7V5a2 2 0 0 1 2-2h7v18h-7a2 2 0 0 1-2-2v-2M15 12H3m0 0 3-3m-3 3 3 3"/>',
  moon: '<path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
};
let epoch = 0;
const liveUrls = new Set();

function icon(name) {
  return `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ''}</svg>`;
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmt(n) { return Number(n || 0).toLocaleString('id-ID'); }
function apiUrl(p) {
  if (/^https?:\/\//i.test(p)) return p;
  const path = p.startsWith('/') ? p : '/' + p;
  return (API_BASE || '') + path;
}
function fmtWib(iso) {
  const d = new Date(iso);
  if (!iso || Number.isNaN(d.getTime())) return 'waktu tidak tercatat WIB';
  const s = new Intl.DateTimeFormat('id-ID', {
    timeZone: 'Asia/Jakarta', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit',
  }).format(d);
  return s + ' WIB';
}
function jenisLabel(j) { return j === 'penggilingan' ? 'Penggilingan' : j === 'pengeringan' ? 'Pengeringan' : String(j || ''); }
function flagLabel(f) { return f === 'C' ? 'Cadangan' : f === 'U' ? 'Utama' : String(f || ''); }
function roleLabel(r) { return r === 'admin' ? 'Admin' : r === 'pml' ? 'PML' : r === 'mitra' ? 'Mitra' : String(r || ''); }
function orangText(o) {
  if (!o || (!o.nama && !o.id)) return '—';
  if (o.nama && o.id) return o.nama + ' (' + o.id + ')';
  return o.nama || o.id;
}
function statusMark(st) {
  const map = { belum: 'Belum', draf: 'Draf', sudah: 'Sudah', ditolak: 'Ditolak' };
  const k = map[st] ? st : 'belum';
  return `<span class="st st-${k}"><i></i>${map[k]}</span>`;
}
function staleHtml(meta) {
  if (!meta || meta.stale !== true) return '';
  return `<div class="stale" role="status">Data sumber terakhir disinkronkan ${esc(fmtWib(meta.syncedAt))}</div>`;
}
function errBlock(err) {
  if (!err) return '';
  const retry = err.retryAfter ? `<p class="retry">Retry-After: ${esc(err.retryAfter)}</p>` : '';
  return `<div class="err" role="alert"><p>${esc(err.message || '')}</p>${retry}</div>`;
}
function fieldMsg(name) {
  const msg = S.fieldErr && S.fieldErr[name];
  if (!msg) return '';
  return `<p class="fielderr" id="err-${esc(name)}">${esc(msg)}</p>`;
}
function errFrom(json, status, headers) {
  const e = json && json.error;
  let code = '', message = '', fields = null;
  if (e && typeof e === 'object') {
    code = String(e.code || '');
    message = typeof e.message === 'string' ? e.message : '';
    fields = e.fields && typeof e.fields === 'object' ? e.fields : null;

      }
    }
  }
  if (S.keepScroll) window.scrollTo(0, y);

async function compressImage(file) {
  if (!file || !String(file.type || '').startsWith('image/')) {
    const err = new Error('Pilih berkas gambar.');
    err.code = 'LOCAL';
    throw err;
  }
  let bmp;
  try { bmp = await createImageBitmap(file); }
  catch {
    const err = new Error('Gambar tidak dapat dibaca.');
    err.code = 'LOCAL';
    throw err;
  }
  const max = 1600;
  const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width * scale));
  const h = Math.max(1, Math.round(bmp.height * scale));
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  canvas.getContext('2d').drawImage(bmp, 0, 0, w, h);
  if (bmp.close) bmp.close();
  const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.75));
  if (!blob) {
    const err = new Error('Gagal mengompres foto.');
    err.code = 'LOCAL';
    throw err;
  }
  if (blob.size > 2 * 1024 * 1024) {
    const err = new Error('Foto masih lebih besar dari 2 MB setelah dikompres. Pilih foto lain.');
    err.code = 'LOCAL';
    throw err;
  }
  return blob;
}
function uploadFoto(jenis, id, slot, blob, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', apiUrl('/api/sampel/' + jenis + '/' + encodeURIComponent(id) + '/foto/' + slot));
    if (S.token) xhr.setRequestHeader('Authorization', 'Bearer ' + S.token);
    xhr.upload.onprogress = ev => {
      if (ev.lengthComputable && onProgress) onProgress(ev.loaded / ev.total);
    };
    xhr.onload = () => {
      let json = {};
      try { json = JSON.parse(xhr.responseText || '{}'); } catch { json = {}; }
      const headers = { get: name => xhr.getResponseHeader(name) };
      if (xhr.status === 401) {
        const err = errFrom(json, 401, headers);
        if (err.code === 'UNAUTHENTICATED' || !err.code) { clearSession(); paintLogin(); }
        reject(err);
        return;
      }
      if (xhr.status >= 200 && xhr.status < 300) { resolve(json); return; }
      reject(errFrom(json, xhr.status, headers));
    };
    xhr.timeout = TIMEOUT_MS;
    xhr.onerror = () => {
      const err = new Error('Gagal mengunggah. Periksa sambungan.');
      err.status = 0;
      err.code = 'NETWORK';
      reject(err);
    };
    xhr.ontimeout = () => reject(timeoutError());
    const fd = new FormData();
    fd.append('file', blob, slot + '.jpg');
    xhr.send(fd);
  });
}
async function kirimFoto(slot, blob) {
  const { jenis, id } = S.view;
  const form = readForm();
  if (form) S.form = Object.assign({ _id: jenis + ':' + id }, form);
  const meter = document.querySelector('[data-meter="' + slot + '"]');
  const bar = meter ? meter.querySelector('i') : null;
  const msg = document.querySelector('[data-foto-msg="' + slot + '"]');
  if (meter) meter.hidden = false;
  if (bar) bar.style.width = '0%';
  if (msg) msg.textContent = '';
  try {
    const json = await uploadFoto(jenis, id, slot, blob, p => { if (bar) bar.style.width = Math.round(p * 100) + '%'; });
    if (S.fotoRetry) delete S.fotoRetry[slot];
    S.banner = null;
    S.cache = null;
    if (S.holdFetch && S.detailDoc) {
      const foto = (S.detailDoc.foto || []).find(f => f.slot === slot);
      if (foto) {
        foto.terisi = true;
        foto.url = json.url;
        foto.uploadedAt = json.uploadedAt;
      }
      if (S.detailDoc.sampel && json.fotoTerisi != null) S.detailDoc.sampel.fotoTerisi = json.fotoTerisi;
    } else S.holdFetch = false;
    render();
  } catch (e) {
    if (e.status === 401) return;
    S.fotoRetry[slot] = { blob, message: e.message };
    if (e.status === 502) {
      if (msg) msg.textContent = e.message;
      const btn = document.querySelector('[data-act="retry-foto"][data-slot="' + slot + '"]');
      if (btn) btn.hidden = false;
      S.banner = e;
      const host = document.getElementById('isi');
      if (host && !host.querySelector(':scope > .err')) host.insertAdjacentHTML('afterbegin', errBlock(e));
      return;
    }
    if (e.status === 409 && (e.code === 'CONFLICT' || e.code === 'LOCKED')) {
      S.banner = e;
      S.modal = { type: e.code === 'CONFLICT' ? 'conflict' : 'locked', message: e.message };
      if (e.code === 'CONFLICT') S.holdFetch = true;
      render();
      return;
    }
    S.banner = e;
    if (e.fields) S.fieldErr = e.fields;
    render();
  }
}

}
function onSubmit(e) {
  const formId = e.target && e.target.getAttribute ? e.target.getAttribute('id') : '';
  if (formId === 'topsearch') { e.preventDefault(); return; }
  if (formId === 'login') { e.preventDefault(); doLogin(); }
  if (formId === 'dlg') {
    e.preventDefault();
    if (!S.modal) return;
    if (S.modal.type === 'kirim') doSave(true);
    else if (S.modal.type === 'tolak') doTolak();
    else if (S.modal.type === 'koreksi-baru') kirimKoreksiBaru(e.target);
    else if (S.modal.type === 'confirm' || S.modal.type === 'buka-kor') jalankanModal(e.target);
  }
  if (formId === 'kor-mon') { e.preventDefault(); kirimKoreksiMonitoring(e.target); }
  if (formId === 'kor-tanggap') { e.preventDefault(); tanggapiKoreksi(e.target); }
  if (formId === 'kor-ubah') { e.preventDefault(); ubahKoreksi(e.target); }
}
function onKey(e) {
  if (e.key === 'Escape' && S.modal) {
    if (S.modal.type === 'conflict' || S.modal.type === 'locked') S.modal = null;
    else S.modal = null;
    render();
  }
}
document.getElementById('app').addEventListener('click', onClick);
document.getElementById('app').addEventListener('change', onChange);
document.getElementById('app').addEventListener('input', onInput);
document.getElementById('app').addEventListener('submit', onSubmit);
document.addEventListener('keydown', onKey);
window.addEventListener('hashchange', () => { S.navOpen = false; S.fiturTampil = null; window.scrollTo(0, 0); render(); });
(function boot() {
  if (S.dark) document.documentElement.classList.add('dark');
  const saved = localStorage.getItem('sp_session');
  if (saved) {
    try {
      const s = JSON.parse(saved);
      if (s && typeof s.token === 'string') S.token = s.token;
    } catch { localStorage.removeItem('sp_session'); }
  }
  render();
})();
</script>
</body>
</html>
