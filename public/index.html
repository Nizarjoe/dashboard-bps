<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SINTA PADI — Sistem Informasi SKGB Jawa Tengah</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--pri:#10b981;--pri2:#14b8a6;--navy:#0f172a;--bg:#f4fafa;--or:#f97316;--bl:#3b82f6;--pk:#ec4899;--vi:#8b5cf6;}
*{box-sizing:border-box;margin:0;padding:0}
html.dark body{background:#020617;color:#e2e8f0}
html.dark .card{background:#0f172a;border-color:#1e293b}
html.dark .tbl td{border-color:#1e293b;color:#cbd5e1}
html.dark .tbl th{background:#1e293b;color:#94a3b8}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:#0f172a}
.sb{position:fixed;left:0;top:0;bottom:0;width:250px;background:var(--navy);color:#fff;display:flex;flex-direction:column;z-index:50;transition:.2s}
.sb.min{width:64px}.sb.min .lbl{display:none}
.sb .logo{display:flex;gap:10px;align-items:center;padding:18px 16px}
.sb .logo .bx{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.sb .logo b{font-size:17px}.sb .logo small{display:block;font-size:9px;color:#94a3b8;letter-spacing:1px}
.sb nav{flex:1;overflow-y:auto;padding:6px}
.sb a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#cbd5e1;text-decoration:none;font-size:13px;font-weight:600;margin-bottom:2px}
.sb a:hover{background:rgba(255,255,255,.06);color:#fff}
.sb a.on{background:linear-gradient(135deg,rgba(16,185,129,.25),rgba(20,184,166,.2));color:#fff}
.sb .grp{padding:10px 12px 4px;font-size:10px;color:#64748b;letter-spacing:2px;font-weight:700}
.sb .foot{padding:14px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#94a3b8}
.hdr{position:fixed;left:250px;right:0;top:0;height:58px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:40}
.sb.min~.hdr{left:64px}
.hdr .t b{font-size:15px}.hdr .t small{color:#64748b;font-size:11px}
.hdr .r{display:flex;gap:12px;align-items:center;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.main{margin-left:250px;margin-top:58px;padding:22px;transition:.2s}
.sb.min~.main{margin-left:64px}
.card{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid #f1f5f9;padding:18px;margin-bottom:18px}
h1{font-size:24px;font-weight:900;font-style:italic;letter-spacing:-.5px}
.sub{color:#64748b;font-size:13px;margin-bottom:16px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi .c{border-radius:16px;padding:16px;color:#fff}
.kpi .c .n{font-size:30px;font-weight:900}.kpi .c .l{font-size:10px;letter-spacing:2px;opacity:.85}.kpi .c .s{font-size:11px;opacity:.8;margin-top:4px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{background:#f8fafc;text-transform:uppercase;font-size:9px;letter-spacing:1px;color:#64748b;padding:8px 10px;text-align:left;border-bottom:2px solid #e2e8f0;white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid #f1f5f9;white-space:nowrap}
.tbl tr:hover td{background:#f8fafc}
.tbl .tot td{background:#ecfdf5;font-weight:800}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit}
.btn.g{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.btn.n{background:var(--navy);color:#fff}
.btn.w{background:#fff;border:1px solid #e2e8f0;color:#334155}
.btn.o{background:var(--or);color:#fff}
.sel,input,textarea{border:1px solid #e2e8f0;border-radius:10px;padding:9px 12px;font-family:inherit;font-size:13px;background:#fff;color:inherit}
.sel:disabled{background:#f1f5f9;color:#94a3b8}
.fld{margin-bottom:12px}.fld label{display:block;font-size:10px;font-weight:700;letter-spacing:1.5px;color:#64748b;margin-bottom:5px;text-transform:uppercase}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:1px solid #e2e8f0;background:#fff;border-radius:999px;padding:8px 16px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;color:#475569}
.tabs button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-color:transparent}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.5px}
.b-g{background:#d1fae5;color:#065f46}.b-o{background:#ffedd5;color:#9a3412}.b-r{background:#fee2e2;color:#991b1b}.b-bl{background:#dbeafe;color:#1e40af}.b-vi{background:#ede9fe;color:#5b21b6}
.donut{width:130px;height:130px;border-radius:50%;position:relative;margin:10px auto}
.donut::after{content:'';position:absolute;inset:18px;background:#fff;border-radius:50%}
.donut .p{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;font-weight:900}
.seg{display:inline-flex;background:#f1f5f9;border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:700;font-size:11px;cursor:pointer;font-family:inherit;color:#475569}
.seg button.on{background:var(--pri);color:#fff}
.bar{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2))}
.bwrap{display:flex;align-items:center;gap:8px;font-size:11px;margin-bottom:6px}
.bwrap .lb{width:40px;font-weight:700}
.bwrap .tr{flex:1;height:14px;background:#e2e8f0;border-radius:4px;position:relative;overflow:hidden}
.bwrap .tr i.r{position:absolute;left:0;top:0;bottom:0;background:var(--vi)}
.bwrap .tr i.t{position:absolute;top:0;bottom:0;border-left:2px solid #334155}
.wa{background:#22c55e;color:#fff;border:0;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer;font-size:11px;text-decoration:none;display:inline-block}
.wa.off{background:#94a3b8;pointer-events:none}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ecfdf5,#f0fdfa)}
.login .c{background:#fff;border-radius:24px;padding:36px;width:380px;max-width:92vw;box-shadow:0 10px 40px rgba(16,185,129,.15);text-align:center}
.login .bx{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 14px}
.login h1{font-style:normal;letter-spacing:1px}
.login .f{text-align:left;margin-top:14px}
.err{background:#fee2e2;color:#991b1b;padding:10px;border-radius:10px;font-size:12px;margin-top:12px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.mob{display:none}
@media(max-width:900px){
 .sb{transform:translateX(-100%)}.sb.open{transform:none}
 .hdr,.main{margin-left:0;left:0}.sb.min~.hdr,.sb.min~.main{margin-left:0}
 .mob{display:inline-flex}
 .grid2{grid-template-columns:1fr}
}
#map{height:440px;border-radius:12px}
.leaflet-container{font:inherit}
@media print{.sb,.hdr,.tabs,.btn{display:none!important}.main{margin:0}}
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
<div id="app"></div>
<script>
/* ====== STATE ====== */
const S={user:null,route:'dashboard',tab:{},dark:localStorage.getItem('sp_dark')==='1',cache:{},map:null,layer:'ku'};
if(S.dark)document.documentElement.classList.add('dark');
const $=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('id-ID');
let CONST=null;
const toast=m=>{const t=$(`<div class="toast">${esc(m)}</div>`);document.body.appendChild(t);setTimeout(()=>t.remove(),3000)};

/* ====== API ====== */
async function api(p,opt={}){
  const r=await fetch(p,{...opt,headers:{'Content-Type':'application/json',...(S.user?{Authorization:'Bearer '+S.user.token}:{}) ,...(opt.headers||{})}});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&p!=='/api/login'){logout();throw new Error('Sesi habis, login ulang');}
  return j;
}
const sheet=n=>api('/api/sheet/'+n);
function saveCache(n,d){S.cache[n]=d}
const getC=n=>S.cache[n];

/* ====== ROUTES ====== */
const ROUTES=[
 ['dashboard','Dashboard','🏠',''],['peta','Peta','🗺️',''],['ksa-mei','KSA Mei','🌾',''],['ksa-juni','KSA Juni','🌾',''],['identifikasi','Identifikasi Panen','📋',''],
 ['map-k','▸ Mapping Pengeringan','🔄',''],['map-g','▸ Mapping Penggilingan','🏭',''],
 ['peng-t1','▸ Pengeringan Kunjungan 1','💧',''],['peng-t2','▸ Pengeringan Kunjungan 2','💧',''],
 ['gil-dir','▸ Direktori Penggilingan','📞',''],['gil-in','▸ Input Hasil Observasi','⚙️',''],
 ['anom-k','▸ Anomali Kering','⚠️',''],['anom-g','▸ Anomali Giling','⚠️',''],
 ['monitoring','Monitoring GC','📊',''],['pengaturan','Pengaturan','⚙️','admin']
];
function go(r){S.route=r;render();window.scrollTo(0,0)}

/* ====== LOGIN ====== */
function renderLogin(){
  document.getElementById('app').innerHTML=`
  <div class="login"><div class="c">
    <div class="bx">🌾</div>
    <h1>SINTA PADI</h1>
    <div style="font-size:10px;letter-spacing:2px;color:#64748b;font-weight:700;margin-bottom:8px">SISTEM INFORMASI SKGB JAWA TENGAH</div>
    <div style="font-size:11px;color:#94a3b8;margin-bottom:8px">PROVINSI JAWA TENGAH • 2026</div>
    <div class="f"><div class="fld"><label>Username (Kode Kabupaten)</label><input id="lu" placeholder="Contoh: 3301" style="width:100%"></div>
    <div class="fld"><label>Password</label><input id="lp" type="password" placeholder="••••••••" style="width:100%"></div>
    <button class="btn g" id="lb" style="width:100%;padding:12px;font-size:14px">Masuk</button></div>
    <div id="lerr"></div>
    <div style="font-size:10px;color:#94a3b8;margin-top:16px;font-weight:600">HUBUNGI ADMIN BPS PROVINSI JAWA TENGAH JIKA LUPA PASSWORD</div>
  </div></div>`;
  const doLogin=async()=>{
    document.getElementById('lerr').innerHTML='';
    const j=await api('/api/login',{method:'POST',body:JSON.stringify({username:lu.value,password:lp.value})}).catch(e=>({ok:false,error:e.message}));
    if(j.ok){S.user={...j.user,token:j.token};localStorage.setItem('sp_user',JSON.stringify(S.user));go('identifikasi');}
    else document.getElementById('lerr').innerHTML=`<div class="err">${esc(j.error||'Login gagal')}</div>`;
  };
  lb.onclick=doLogin;
  [lu,lp].forEach(el=>el.onkeydown=e=>{if(e.key==='Enter')doLogin()});
}

/* ====== LAYOUT ====== */
function logout(){localStorage.removeItem('sp_user');S.user=null;render()}
function layout(content){
  const u=S.user;
  return `<div class="sb ${S.sbmin?'min':''}" id="sb">
    <div class="logo"><div class="bx">🌾</div><div><b class="lbl">SINTA PADI</b><small class="lbl">SKGB JAWA TENGAH</small></div></div>
    <nav>${ROUTES.filter(r=>!r[3]||r[3]==='admin'&&u.role!=='kab').map(r=>`<a href="#${r[0]}" class="${S.route===r[0]?'on':''}"><span>${r[2]}</span><span class="lbl">${r[1]}</span></a>`).join('')}</nav>
    <div class="foot"><span class="lbl">${esc(u.kode)} · ${esc(u.nama)}</span><br><a href="#" onclick="logout()" style="color:#f87171;font-size:11px;padding:4px 0">⏻ Logout</a></div>
  </div>
  <div class="hdr"><div class="t"><b>SINTA PADI</b> <small>PROVINSI JAWA TENGAH • 2026</small></div>
  <div class="r">
    <button class="btn w mob" onclick="document.getElementById('sb').classList.toggle('open')">☰</button>
    <button class="btn w" onclick="toggleDark()" title="Dark mode">${S.dark?'☀️':'🌙'}</button>
    <span style="font-size:11px;color:#16a34a;font-weight:700"><span class="dot"></span> STATUS API</span>
    <div class="av">${esc(u.kode.slice(-2))}</div>
    <button class="btn w" onclick="logout()">Logout</button>
  </div></div>
  <div class="main">${content}</div>`;
}
function toggleDark(){S.dark=!S.dark;localStorage.setItem('sp_dark',S.dark?'1':'0');document.documentElement.classList.toggle('dark',S.dark);render()}

/* ====== PAGE HELPERS ====== */
function waBtn(no){const d=String(no||'').replace(/\D/g,'');if(!d||d==='-')return '<a class="wa off">WhatsApp</a>';
  let n=d;if(n.startsWith('0'))n='62'+n.slice(1);else if(n.startsWith('8'))n='62'+n;
  return `<a class="wa" target="_blank" href="https://wa.me/${n}">💬 WhatsApp</a>`}
function exportPDF(title,cols,rows){
  const doc=new window.jspdf.jsPDF({orientation:cols.length>7?'landscape':'portrait',unit:'pt'});
  doc.text(title,40,40);doc.setFontSize(9);doc.text('SINTA PADI — '+new Date().toLocaleDateString('id-ID'),40,56);
  doc.autoTable({head:[cols],body:rows.map(r=>cols.map(c=>String(r[c]??''))),startY:70,styles:{fontSize:7},headStyles:{fillColor:[15,23,42]}});
  doc.save(title.replace(/\s+/g,'_')+'.pdf');toast('PDF terunduh ✓');
}
function exportXL(title,cols,rows){
  const ws=XLSX.utils.json_to_sheet(rows.map(r=>{const o={};cols.forEach(c=>o[c]=r[c]);return o}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Data');
  XLSX.writeFile(wb,'SINTA_PADI_'+title.replace(/\s+/g,'_')+'_'+(S.user?S.user.kode:'')+'_'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'.xlsx');toast('Excel terunduh ✓');
}
const expBtns=(t,c,r)=>`<span style="display:inline-flex;gap:6px;margin-left:auto"><button class="btn n" onclick='exportPDF(${JSON.stringify(t)},${JSON.stringify(c)},${JSON.stringify(r)})'>📄 PDF</button><button class="btn g" onclick='exportXL(${JSON.stringify(t)},${JSON.stringify(c)},${JSON.stringify(r)})'>📊 EXCEL</button></span>`;
const filterKab=(id,lock)=>`<select id="${id}" class="sel" ${lock?'disabled':''}><option value="">Semua</option>${(CONST?CONST.kabupaten:[]).map(([k,n])=>`<option value="${k}" ${lock&&S.user.role==='kab'&&k!==S.user.kode?'hidden':''} ${lock&&S.user.role==='kab'?'selected':''}>${k} - ${n}</option>`).join('')}</select>`;

/* ====== PAGES ====== */
async function pgDashboard(){
  const [rl,kpi]=await Promise.all([api('/api/realisasi'),api('/api/kpi')]);
  const t=rl.total,p1=Math.round(t.rK/t.tK*100),p2=Math.round(t.rK2/t.tK*100),pg=Math.round(t.rG/t.tG*100);
  const donut=(p,c1)=>`<div class="donut" style="background:conic-gradient(${c1} ${p*3.6}deg,#e2e8f0 0)"><div class="p">${p}%<small style="font-weight:600;color:#64748b">${fmt(p===p1?t.rK:p===p2?t.rK2:t.rG)}/${fmt(p===p1?t.tK:p===p2?t.tK2:t.tG)}</small></div></div>`;
  const rows=rl.rows;
  let html=`<h1>DASHBOARD</h1><div class="sub">Capaian SKGB (Survei Konversi Gabah ke Beras) Jawa Tengah 2026 — badge LIVE UPDATE</div>
  <div class="kpi">
    <div class="c" style="background:linear-gradient(135deg,#10b981,#14b8a6)"><div class="l">UTAMA KERING</div><div class="n">${fmt(kpi.utamaKering)}</div><div class="s">ELIGIBLE ${fmt(kpi.utamaKering)}</div></div>
    <div class="c" style="background:linear-gradient(135deg,#f97316,#fb923c)"><div class="l">CADANGAN KERING</div><div class="n">${fmt(kpi.cadanganKering)}</div><div class="s">ELIGIBLE ${fmt(kpi.cadanganKering)}</div></div>
    <div class="c" style="background:linear-gradient(135deg,#10b981,#14b8a6)"><div class="l">UTAMA GILING</div><div class="n">${fmt(kpi.utamaGiling)}</div><div class="s">ELIGIBLE ${fmt(kpi.utamaGiling)}</div></div>
    <div class="c" style="background:linear-gradient(135deg,#f97316,#fb923c)"><div class="l">CADANGAN GILING</div><div class="n">${fmt(kpi.cadanganGiling)}</div><div class="s">ELIGIBLE 0</div></div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px">
    <div class="card" style="text-align:center"><span class="badge b-g">LIVE UPDATE</span><div class="donut" style="background:conic-gradient(#10b981 ${p1*3.6}deg,#e2e8f0 0)"><div class="p">${p1}%<small style="color:#64748b;font-weight:600">${fmt(t.rK)}/${fmt(t.tK)}</small></div></div><b>Realisasi Kering Kunjungan Pertama</b></div>
    <div class="card" style="text-align:center"><span class="badge b-g">LIVE UPDATE</span><div class="donut" style="background:conic-gradient(#14b8a6 ${p2*3.6}deg,#e2e8f0 0)"><div class="p">${p2}%<small style="color:#64748b;font-weight:600">${fmt(t.rK2)}/${fmt(t.tK)}</small></div></div><b>Realisasi Kering Kunjungan Kedua</b></div>
    <div class="card" style="text-align:center"><span class="badge b-g">LIVE UPDATE</span><div class="donut" style="background:conic-gradient(#ec4899 ${pg*3.6}deg,#e2e8f0 0)"><div class="p">${pg}%<small style="color:#64748b;font-weight:600">${fmt(t.rG)}/${fmt(t.tG)}</small></div></div><b>Realisasi Penggilingan</b></div>
  </div>
  <div class="card"><b>Realisasi Per Kabupaten/Kota</b><div class="sub">DETAIL DISTRIBUSI CAPAIAN PENGERINGAN — TOTAL: 35 WILAYAH</div>
  ${rows.map(r=>{const p=Math.round(r.rK/r.tK*100);return `<div class="bwrap"><span class="lb">${r.kode}</span><div class="tr"><i class="r" style="width:${Math.min(100,p)}%"></i><i class="t" style="left:${Math.min(100,Math.round(r.rK2/r.tK*100))}%"></i></div><b style="width:70px;text-align:right">${fmt(r.rK)}/${fmt(r.tK)}</b></div>`}).join('')}
  <div style="display:flex;gap:12px;margin-top:12px"><div class="card" style="flex:1;margin:0;text-align:center"><small>RATA-RATA</small><div style="font-size:22px;font-weight:900;color:#10b981">${Math.round(rows.reduce((a,r)=>a+r.rK/r.tK,0)/rows.length*100)}%</div></div>
  <div class="card" style="flex:1;margin:0;text-align:center"><small>WILAYAH AKTIF</small><div style="font-size:22px;font-weight:900;color:#3b82f6">${rows.filter(r=>r.rK>0).length}</div></div></div></div>
  <div class="card"><b>Tabel Per Kabupaten/Kota</b><div class="sub">TARGET, REALISASI & PERSENTASE — PENGERINGAN & PENGGILINGAN</div>
  <div style="overflow-x:auto"><table class="tbl"><tr><th>KAB</th><th>NAMA</th><th>PENG. TARGET</th><th>PENG. REALISASI</th><th>PENG. %</th><th>GIL. TARGET</th><th>GIL. REALISASI</th><th>GIL. %</th></tr>
  ${rows.map(r=>{const pk=Math.round(r.rK/r.tK*100),pg2=Math.round(r.rG/r.tG*100);return `<tr><td>${r.kode}</td><td>${esc(r.nama)}</td><td>${fmt(r.tK)}</td><td>${fmt(r.rK)}</td><td><span class="badge ${pk>=100?'b-g':pk===0?'b-r':'b-o'}">${pk}%</span></td><td>${fmt(r.tG)}</td><td>${fmt(r.rG)}</td><td><span class="badge ${pg2>=100?'b-g':pg2===0?'b-r':'b-o'}">${pg2}%</span></td></tr>`}).join('')}

async function drawMap(){
  const el=document.getElementById('map');if(!el)return;
  if(S.map){S.map.remove();S.map=null}
  S.map=L.map(el).setView([-7.3,109.8],8);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(S.map);
  let gj;try{gj=await(await fetch('https://raw.githubusercontent.com/superpikar/indonesia-geojson/master/indonesia-district-simple.json')).json()}catch(e){gj=null}
  const rl=await api('/api/realisasi');
  const val=r=>({ku:r.rK,kc:r.rK,kt1:r.rK,kt2:r.rK2,kg:r.rG}[S.layer]||0);
  const max=Math.max(...rl.rows.map(val),1);
  if(gj){
    const byKode={};rl.rows.forEach(r=>byKode[r.nama.toUpperCase()]=val(r));
    L.geoJSON(gj,{filter:f=>{const n=(f.properties.Name||f.properties.name||'').toUpperCase();return n.includes('JAWA TENGAH')||true},style:f=>{
      const n=(f.properties.Name||f.properties.name||'').toUpperCase();
      let v=null;for(const k in byKode){if(n.includes(k.replace('KOTA ',''))){v=byKode[k];break}}
      const c=v==null?'#f1f5f9':['#dcfce7','#bbf7d0','#86efac','#4ade80','#22c55e'][Math.min(4,Math.floor(v/(max/4.01)))];
      return {fillColor:c,fillOpacity:.85,color:'#fff',weight:1};
    },onEachFeature:(f,l)=>{const n=(f.properties.Name||f.properties.name||'');l.bindTooltip(n);l.on('click',()=>{const r=rl.rows.find(r=>n.toUpperCase().includes(r.nama));if(r)toast(r.nama+': '+val(r))})}}).addTo(S.map);
  }else{
    // fallback: circles per kab at approximate centroid — skip
    toast('GeoJSON kab tidak termuat — peta base only');
  }
}

      j.success?toast('Mapping penggilingan tersimpan ✓'):toast('Gagal');
    };
    setTimeout(drawMG,30);
  }
  return html;
}

async function pgAnomali(jenis){
  const isK=jenis==='k';
  const data=isK?await sheet('kering1'):await sheet('giling');
  const H=(CONST||await api('/api/constants')).hasilPencacahan[0];
  const rows=(isK?data.data.filter(r=>r.hasil!==H):data.data.filter(r=>r.hasil!==H));
  let html=`<h1>ANOMALI ${isK?'KERING':'GILING'}</h1><div class="sub">Daftar pencacahan ${isK?'pengeringan tahap 1':'penggilingan'} yang gagal/anomali (hasil ≠ 1. Berhasil diwawancarai).</div>
  <div class="card"><div style="display:flex;gap:10px;align-items:center;margin-bottom:12px"><div style="background:#ffedd5;border-radius:12px;padding:12px 18px;display:flex;align-items:center;gap:10px"><span style="font-size:22px">⚠️</span><div><div style="font-size:9px;letter-spacing:1px;font-weight:800;color:#9a3412">TOTAL ANOMALI</div><div style="font-size:22px;font-weight:900;color:#9a3412">${fmt(rows.length)}</div></div></div><button class="btn w" onclick="render()">⟳ Refresh</button></div>

  ${rows.slice(0,100).map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.kab)}</td><td>${esc(r.petugas)}</td><td>${esc(r.jenis)}</td><td><b>${esc(r.id)}</b></td><td><span class="badge b-r">${esc(r.hasil)}</span></td></tr>`).join('')||'<tr><td colspan="6" style="color:#16a34a;padding:20px">✓ Tidak ada anomali</td></tr>'}</table></div></div>`;

/* ====== ROUTER ====== */
const PAGES={
  dashboard:pgDashboard,peta:pgPeta,identifikasi:pgIdentifikasi,
  'ksa-mei':()=>pgKSA('Mei'),'ksa-juni':()=>pgKSA('Juni'),
  'map-k':()=>pgMapping('k'),'map-g':()=>pgMapping('g'),
  'peng-t1':()=>pgPengeringan(1),'peng-t2':()=>pgPengeringan(2),
  'gil-dir':pgDirektori,'gil-in':pgGilingInput,
  'anom-k':()=>pgAnomali('k'),'anom-g':()=>pgAnomali('g'),
  monitoring:pgIdentifikasi,pengaturan:pgPengaturan
};
async function render(){
  const app=document.getElementById('app');
  if(!S.user){
    const saved=localStorage.getItem('sp_user');
    if(saved){S.user=JSON.parse(saved);/* validate */}
    if(!S.user)return renderLogin();
    try{const j=await api('/api/me');S.user={...S.user,...j.user}}catch(e){return}
  }
  if(!CONST)CONST=await api('/api/constants');
  if(S.route==='monitoring'){S.tab.ident='gc'}
  if(S.route==='monitoring'&&S.tab.ident==='gc'){
    const html=layout(await (async()=>{const inner=await pgIdentifikasi();return inner.split('<div class="tabs">')[0]+'<div class="tabs"><button onclick="S.tab.ident=\'lookup\';go(\'identifikasi\')">Lookup Database</button><button onclick="S.tab.ident=\'input\';go(\'identifikasi\')">Input Hasil</button><button class="on">Monitoring GC</button></div>'+(await (async()=>{const m=await pgIdentifikasi();return m.split('Monitoring GC</button>').pop()})())})());
    app.innerHTML=html;return;
  }
  const page=PAGES[S.route]||pgDashboard;
  app.innerHTML=layout(await page());
}
window.go=go;window.logout=logout;window.S=S;window.toggleDark=toggleDark;
render();
